name: Semantic review (advisory)

# PHASE B — the judgement layer, AFTER the deterministic gates.
#
# This does NOT replace the unit suites, tsc, the guardrail or preflight. Those are
# the merge authority. This reads the same diff and looks for what a rule engine
# cannot: a number that will come out wrong, an auth boundary quietly widened, an
# assertion deleted so a change would pass.
#
# ADVISORY BY CONSTRUCTION, AND THAT IS DELIBERATE.
# It depends on an external LLM: a key can expire, a provider can rate-limit, a
# model can be retired. A red build caused by someone else's quota is not a
# technical signal about this change, and a gate that cries wolf gets ignored or
# removed. So every failure path here ends in "semantic review NOT VERIFIED",
# never in a failed deterministic task.
#
# Do NOT add this to branch protection's required checks.
#
# WHY `pull_request` AND NOT `pull_request_target`
# The upstream example uses pull_request_target, which runs with repository
# secrets in the base context — powerful enough to comment on fork PRs, and a
# well-known way to leak secrets to code the fork controls. This repository works
# in branches, not forks, so the safer trigger is enough. A fork PR simply gets no
# semantic review, which is the correct trade.
#
# ACTIVATION (nothing below runs until this is done)
#   Settings -> Secrets and variables -> Actions
#     secret  OCR_LLM_TOKEN   API key for the provider
#     variable OCR_LLM_URL    e.g. https://api.anthropic.com
#     variable OCR_LLM_MODEL  e.g. claude-sonnet-5
#     variable OCR_USE_ANTHROPIC  "true" for Anthropic protocol, "false" for OpenAI
#   Until then the job reports NOT VERIFIED and exits 0.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: semantic-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-review:
    name: Semantic review (does not gate merge)
    runs-on: ubuntu-latest
    steps:
      - name: Is the reviewer configured?
        id: configured
        env:
          TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report NOT VERIFIED when it cannot run
        if: steps.configured.outputs.ready != 'true'
        run: |
          {
            echo "## Semantic review: NOT VERIFIED"
            echo
            echo "No \`OCR_LLM_TOKEN\` is configured, so no semantic review ran on this PR."
            echo
            echo "This is **not** a pass. The deterministic gates (preflight,"
            echo "change-guardrail, contract tests) are unaffected and remain the merge"
            echo "authority; the judgement layer simply did not happen."
            echo
            echo "Activation steps are documented at the top of"
            echo "\`.github/workflows/semantic-review.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Semantic review NOT VERIFIED::No LLM credential configured; deterministic gates unaffected."

      - uses: actions/checkout@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          fetch-depth: 0

      # Pinned action AND pinned npm version: a review whose behaviour changes
      # under you is not reproducible, and @main changes daily.
      #
      # SECURITY: GHSA-wwg6-qfxw-xffj is a path traversal in the handling of
      # `.opencodereview/rule.json` - the very file this repository now ships -
      # letting a rule entry read arbitrary host files (up to 512 KB) and send
      # them to the LLM provider. Affected < 1.11.1, patched in 1.11.1, so the pin
      # below contains the fix. Verify this again before raising the pin.
      # v1.12.7 also exists upstream (published one day later); 1.12.6 is pinned
      # deliberately as the one-release-behind, owner-chosen version.
      - name: OpenCodeReview
        id: ocr
        if: steps.configured.outputs.ready == 'true'
        continue-on-error: true            # advisory: never fails the build
        uses: alibaba/open-code-review@v1.12.6
        with:
          ocr_version: "1.12.6"
          llm_url: ${{ vars.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_USE_ANTHROPIC }}

          # AppBI-specific rules. Without this it reviews generic NPE/XSS and
          # misses the things that actually break this product.
          rule: .opencodereview/rule.json

          # PR diff only, and incremental across pushes — not a full-repo scan.
          base_ref: ${{ github.event.pull_request.base.ref }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          incremental: "true"
          checkpoint_range: "true"

          # Cost ceiling. An unbounded reviewer on a large PR is a surprise bill.
          max_tokens_budget: "400000"
          effort: "medium"
          review_concurrency: "4"
          llm_timeout: "300"
          review_task_timeout: "15"

          background: "AppBI is a governed BI platform. The expensive failures are a silently WRONG NUMBER from the semantic layer, a public/embed link reaching authenticated data, and a weakened test or gate. Deterministic gates already cover types, imports, migrations chain and architecture layering - do not re-report those. Prioritise correctness of computed values, auth and public boundaries, regression coverage that was removed or weakened, and changes to the protection infrastructure."
          language: English
          sticky_summary: "true"
          upload_artifacts: "true"

      - name: Say plainly when the review did not complete
        if: steps.configured.outputs.ready == 'true' && steps.ocr.outcome != 'success'
        run: |
          {
            echo "## Semantic review: NOT VERIFIED"
            echo
            echo "The reviewer ran but did not complete (provider error, quota, timeout,"
            echo "or a model change). **No semantic findings were produced for this PR.**"
            echo
            echo "Treat this as absent coverage, not as approval. Deterministic gates are"
            echo "unaffected and remain the merge authority."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Semantic review NOT VERIFIED::The reviewer did not complete; no findings were produced."
