name: E2E (Playwright, full stack)

# WHY A SEPARATE WORKFLOW.
#
# The contract suite runs in seconds against a SQLite file and is the right gate
# for every push. This one stands up Postgres, the backend, and a Next.js build,
# so it is slower and it fails for reasons the contract suite cannot see: a route
# that moved, a page that throws in the browser, a flow that saves and comes back
# without its bindings.
#
# It is NOT route-mocked. Browser, Next.js, API, database and the Agent Flow
# runtime are all real; what these tests avoid is spending money on a model, and
# they do it by exercising deterministic steps rather than by faking the backend.

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  # CALLED BY `product-gate.yml` ON PULL REQUESTS.
  #
  # The `pull_request` trigger moved there. It is not a reorganisation for its
  # own sake: the filter below lives at the WORKFLOW level, so on an irrelevant
  # PR this produced no check run at all, and a branch-protection rule cannot
  # require a check that may never appear. `product-gate` classifies the diff
  # first and calls this when it is relevant, so there is one always-present
  # status and the expensive suites still skip the diffs they do not concern.
  #
  # The push trigger and its paths are unchanged, so pushing to a branch still
  # pays only for what it touched.
  workflow_call:
jobs:
  e2e:
    runs-on: ubuntu-latest
    # ~22 min before the device-layout journeys (public-closure-responsive,
    # ~16 min, 15 serial journeys) were added; 30 cancelled the run mid-suite.
    # ~39 min with them; the UI/UX acceptance suite (dashboard-responsive-uiux*,
    # ~20 min of serial real-browser journeys) brings it to ~60.
    timeout-minutes: 80

    services:
      postgres:
        # The same image docker-compose.yml runs. Stock `postgres:15` carries no
        # pgvector, so `CREATE EXTENSION IF NOT EXISTS vector` failed and the
        # `Build the schema` step never got as far as starting the app. See the
        # longer note in backend-contract-tests.yml.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: appbi
          POSTGRES_PASSWORD: appbi
          POSTGRES_DB: appbi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: "postgresql://appbi:appbi@localhost:5432/appbi"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: appbi
      DB_USER: appbi
      DB_PASSWORD: appbi
      # DATASOURCE_ENCRYPTION_KEY is generated per run by a step below (AI Keys).
      ENVIRONMENT: test
      # The fixture datasource is the CI Postgres service on localhost; the egress
      # policy refuses loopback unless explicitly allowed (dev/CI only - production
      # startup refuses this setting).
      DATASOURCE_ALLOW_LOOPBACK: "true"

      # ONE SECRET, OR THE FRONTEND CANNOT READ WHAT THE BACKEND SIGNED.
      #
      # `middleware.ts` does not merely look for the cookie, it VERIFIES the JWT
      # (`jwtVerify`, jose). It falls back to 'change-this-in-production'; the
      # backend falls back to 'dev-secret-key-change-in-production'. Two different
      # literals for the same secret. With neither set — which is what this job
      # did — the backend signed a perfectly good token and the Edge middleware
      # rejected every one, so each authed page bounced to /login carrying only
      # `refresh_token` (that cookie is scoped to the refresh endpoint, so it is
      # never sent to a page route and cannot rescue the redirect either).
      #
      # 13 specs failed on that and reported it as "flow list did not render" and
      # "Test button not found" — product symptoms for a configuration cause. The
      # same suite passes locally in 11.6s because docker-compose hands all three
      # services ONE `SECRET_KEY`.
      #
      # Job-level so it reaches all three: uvicorn, `next build` (the Edge bundle
      # inlines it) and `next start`.
      SECRET_KEY: e2e-secret-not-a-production-value

      # THIS DEPLOYMENT CONFIGURES NO MODEL, AND SAYS SO RATHER THAN BEING GUESSED.
      #
      # A spec that needs a provider used to discover that by probing and reading a
      # status code, which only worked while there was also no LINK to run against —
      # once one is seeded the endpoint answers 200 with a failed run, and the guard
      # stops firing. Declaring it here keeps the precondition where the decision is
      # actually made. Spending on a vendor to turn a skip into a pass would buy a
      # number, not coverage.
      E2E_NO_MODEL: "1"

      # THE MODULE UNDER TEST HAS TO BE MOUNTED.
      #
      # `api/__init__.py` includes the Agent Flows router — and the Direct Chat
      # router with it — only `if settings.METADATA_CATALOG_ENABLED`, which
      # defaults to False. This job never set it, so the backend came up without
      # a single `/agent-flows/*` route and every call answered
      # `{"detail":"Not Found"}`: `PUT /brains` 404, `GET /nodes` 404, and the
      # builder page rendering an empty shell because nothing behind it existed.
      #
      # The suite was not finding bugs in Agent Flows; it was running against a
      # deployment where Agent Flows was switched off. `.env.example` and
      # docker-compose both turn it on, so CI now matches what ships.
      METADATA_CATALOG_ENABLED: "true"
      # The authorization gate (project `security`) exercises the public
      # workspace routes, which are only mounted with Workboards on; without it
      # every workspace assertion is a 404 before any auth check runs.
      WORKBOARDS_ENABLED: "true"
      PYTHONPATH: ${{ github.workspace }}/backend
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:8000

      # THE BROWSER TALKS TO THE APP THE WAY PRODUCTION DOES: same-origin.
      #
      # This job used to bake `NEXT_PUBLIC_API_URL: http://localhost:8000`, but
      # the client's own default is `/api/v1` — the value is expected to ALREADY
      # carry that prefix. Without it every call went to
      # `http://localhost:8000/auth/me`, which is not a route, so the CORS
      # preflight got a 404 instead of a 204 and the browser reported
      #
      #   blocked by CORS policy: Response to preflight request doesn't pass
      #   access control check: It does not have HTTP ok status
      #
      # Relative also matches how the product actually ships (compose bakes
      # `/api/v1`), so the suite exercises the same path a real deployment does
      # rather than a cross-origin one that exists only in CI.
      NEXT_PUBLIC_API_URL: /api/v1
      # WHERE THAT SAME-ORIGIN PATH IS PROXIED TO. `middleware.ts` rewrites
      # `/api/v1/*` to BACKEND_URL and falls back to `http://backend:8000/api/v1`
      # — a docker-compose hostname that does not resolve on a GitHub runner.
      BACKEND_URL: http://localhost:8000/api/v1
      # Final-release closure: full-stack Playwright includes one REAL
      # multi-page worker export. API and worker share this local directory.
      PDF_EXPORT_ENABLED: "true"
      PDF_RENDER_BASE_URL: http://localhost:3000
      DATA_DIR: ${{ github.workspace }}/.artifacts/e2e-pdf-data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          # The API image stays slim in production; CI opts into the same two
          # packages Dockerfile.pdf installs for the real render worker.
          pip install pymupdf==1.24.14 playwright==1.49.1

      # AI KEYS ARE STORED ENCRYPTED, OR NOT AT ALL.
      #
      # Agent Flow steps run only on keys from the AI Keys store, and the store
      # refuses to save one when DATASOURCE_ENCRYPTION_KEY is empty (it would
      # otherwise hold the secret in plaintext). Specs that publish or test a flow
      # therefore give its steps a FAKE key, which needs a working store. The key
      # is generated per run, so no key material lives in this file.
      - name: Generate a throwaway encryption key
        working-directory: backend
        run: |
          echo "DATASOURCE_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Build the schema
        working-directory: backend
        run: alembic upgrade head

      - name: Seed the E2E account
        working-directory: backend
        run: python scripts/ci/seed_e2e_user.py

      # A link with an ACTIVE binding, which `surfaces.spec.ts` needs and a
      # freshly migrated database does not have. Without it that spec skipped
      # itself on every run — and a skip that reports as a suite property rather
      # than a missing fixture is how coverage quietly disappears. It seeds no
      # model credential: the four provider-dependent specs stay skipped on
      # purpose.
      - name: Seed a bound public link
        working-directory: backend
        run: python scripts/ci/seed_e2e_binding.py

      # The dashboard the presentation gate measures (dashboard-presentation.spec
      # .ts): real rows through the Excel-upload service, charts through
      # ChartService, a section header, a slicer and a fixed public link. The spec
      # FAILS on CI when this is missing — a presentation gate that skips would
      # report a pass for a check that never ran.
      - name: Seed the presentation fixture
        working-directory: backend
        run: python scripts/ci/seed_e2e_presentation.py

      # The Pair #5 data-state contracts (data-state.spec.ts): a live source in
      # its own schema of this database, a calculated column, a semantic model
      # that names a missing column, a failed publish over a published
      # generation, a relation that cannot be built. Without it the spec FAILS
      # (it looks its fixtures up by name) rather than passing on nothing.
      - name: Seed the data-state fixture
        working-directory: backend
        run: python scripts/ci/seed_e2e_data_state.py

      # AUTHORIZATION RELEASE GATE fixture: isolated principals (owner, viewer,
      # editor, builder, module admin, unrelated, team member, app user) with
      # tokens minted by the product's own functions, read by
      # e2e/tests/security/*.spec.ts (project `security`, retries 0). A missing
      # fixture FAILS the spec, never skips it.
      - name: Seed the security fixture
        working-directory: backend
        run: python scripts/ci/seed_e2e_security.py

      - name: Start the backend
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Build and start the frontend
        working-directory: frontend
        # NEXT_PUBLIC_API_URL and BACKEND_URL come from the job env. A step-level
        # `NEXT_PUBLIC_API_URL: http://localhost:8000` used to sit here and won
        # over the job value, which is how the missing `/api/v1` prefix survived.
        run: |
          npm ci
          npm run build
          npm run start -- --port 3000 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/login && break
            sleep 2
          done
          curl -sf http://localhost:3000/login

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m playwright install chromium

      - name: Start the real PDF worker
        working-directory: backend
        run: |
          mkdir -p "$DATA_DIR"
          python -m app.scripts.pdf_worker > ../.artifacts/e2e-pdf-worker.log 2>&1 &
          echo $! > ../.artifacts/e2e-pdf-worker.pid
          sleep 3
          kill -0 "$(cat ../.artifacts/e2e-pdf-worker.pid)"

      - name: Run the suite
        working-directory: e2e
        run: npx playwright test

      # A reviewer must be able to see what broke without reproducing it locally.
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
            .artifacts/e2e-pdf-worker.log
          retention-days: 14
