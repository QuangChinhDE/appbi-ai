name: Preflight (commit integrity)

# Cheap, fast gate on EVERY push/PR (no path filter) — proves the committed tree
# can boot and build, independent of any dev's dirty working tree. Born from a
# string of prod 502s where a provider was left uncommitted while its consumers
# were pushed: a migration parent (alembic KeyError), an exported FE function
# (next-build type error), a deleted module (ImportError). Each has a check here.
#
# Make this a REQUIRED status check in branch protection so a red run blocks the
# merge/deploy — that is what turns it from advisory into a real gate.

on:
  push:
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 1. Alembic revision graph (no DB needed) ──────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Alembic chain (missing parent / multiple heads)
        run: python scripts/ci/alembic_chain.py

      # ── 1b. Guardrail self-audit ──────────────────────────────────────────
      # The guardrail's rules are only worth trusting while they still describe
      # the code. `check_rules_health` proves every invariant marker still
      # exists in real source; `verify_semantic_contract` reports DRIFT when a
      # semantic backbone file/symbol was renamed or removed, or a new semantic
      # service appeared unregistered. Both existed and ran nowhere.
      - name: Guardrail rules health + semantic contract drift
        run: |
          pip install PyYAML
          python scripts/ci/guardrail_check.py --health

      # ── 1c. Claude workflow config (schema of .claude/) ───────────────────
      # Provider-neutral: validates the Claude adapter (delegating to
      # check_claude_config.py), AGENTS.md for Codex, that the adapters import one
      # contract instead of keeping two, and that every path they promise exists.
      - name: Agent contract + adapters (Claude + Codex)
        run: python scripts/ci/check_agent_config.py
      - name: Safety-system tests (Stop gate + provider-neutral SDLC)
        run: |
          pip install pytest
          python -m pytest -q scripts/ci/test_stop_gate.py scripts/ci/test_agent_sdlc.py

      # ── 2. Frontend typecheck (uncommitted-provider / type breaks) ────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit --incremental false

      # ── 2b. Frontend QA contracts ─────────────────────────────────────────
      # These three scripts already existed and were in no gate at all. The
      # module-route one was written because a forgotten route silently showed
      # a module shell to a user with no access — a check that only runs when
      # someone remembers it would not have caught that either.
      - name: Frontend QA contracts (module routes, theme, presentation)
        working-directory: frontend
        run: npm run qa

      # ── 3. Backend import smoke (deleted/renamed module) ──────────────────
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Backend import smoke (import app.main)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./_preflight.db"
          PYTHONPATH: ${{ github.workspace }}/backend
          ENVIRONMENT: "test"
          SECRET_KEY: "ci-preflight-secret-key-not-used-in-production-please-do-not-copy"
          DATASOURCE_ENCRYPTION_KEY: "0j7eUt3wx+0UtT7hH5LnuMpLiDmTN7f1WaRtPyEcjPw="
          # THE FLAGGED MODULES HAVE TO BE IMPORTED, OR THIS SMOKE TEST IS BLIND.
          #
          # `api/__init__.py` imports the agent_flows and metadata_catalog routers
          # only `if settings.METADATA_CATALOG_ENABLED`, which DEFAULTS TO FALSE.
          # Measured: with the flag unset, `import app.main` pulls in ZERO
          # agent_flows router modules — so a broken import in the largest module
          # in the repo passed the gate whose entire purpose is "lazy imports hide
          # breakage until runtime".
          METADATA_CATALOG_ENABLED: "true"
          GOVERN_ENABLED: "true"
        run: python -c "import app.main"
