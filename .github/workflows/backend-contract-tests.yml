name: Backend semantic-contract tests

# Locks the PowerBI-parity semantic contract in CI (reviewer ask: "đưa
# regression golden vào tracked CI"), split into two tiers:
#
#   • unit         — SQLite / hand-built views, NO BigQuery or live Postgres.
#                    Deterministic; runs on every push/PR touching the backend.
#   • integration  — seeds the snowflake fixture into a real Postgres and
#                    replays the golden harness end-to-end through ChartService.
#
# The unit tier pins the contract invariants (single-resolver fail-loud, no-agg-
# defers-to-declared-type, hard/soft dropped-filter policy, cross-table measure
# grain, the FE auto-seed agg contract). The integration tier proves the actual
# *behaviour* (cross-table measures, conformed-dim filters, group-by JOIN,
# declared measures) against emitted SQL — which SQLite cannot exercise.

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-contract-tests.yml"
      # The metric-identity ('auto' vs 'sum') + role contract also lives in the
      # FE — run the contract suite (incl. the structural FE guard in
      # test_locked_contract.py) when these change, so a FE revert to 'sum' or a
      # role-slot regression is caught even though the rest of the diff is FE.
      - "frontend/src/components/explore/**"
      - "frontend/src/lib/explore-query.ts"
  # CALLED BY `product-gate.yml` ON PULL REQUESTS.
  #
  # The `pull_request` trigger moved there. It is not a reorganisation for its
  # own sake: the filter below lives at the WORKFLOW level, so on an irrelevant
  # PR this produced no check run at all, and a branch-protection rule cannot
  # require a check that may never appear. `product-gate` classifies the diff
  # first and calls this when it is relevant, so there is one always-present
  # status and the expensive suites still skip the diffs they do not concern.
  #
  # The push trigger and its paths are unchanged, so pushing to a branch still
  # pays only for what it touched.
  workflow_call:
jobs:
  # ── Tier 1: unit (no external DB) ──────────────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # No external DB — the suites set a SQLite URL themselves, but provide a
      # default so any import-time engine creation succeeds.
      DATABASE_URL: "sqlite:///./ci_contract.db"
      PYTHONPATH: ${{ github.workspace }}/backend

      # THE MODULES THE SUITE ASSERTS ABOUT HAVE TO EXIST.
      #
      # `permissions._OPTIONAL_MODULES` gates `govern`, `agent_flows` and `chat`
      # behind METADATA_CATALOG_ENABLED and GOVERN_ENABLED, and both default to a
      # deployment that has them off. With the flags unset, `MODULE_ALLOWED_LEVELS`
      # simply has no `chat` key and a test asserting its permission ladder fails
      # with `KeyError: 'chat'` — not because the ladder is wrong, but because the
      # module was compiled out from under it.
      #
      # `.env.example` and docker-compose both turn these on, so this is the
      # configuration that ships. It is the same flag whose absence left the E2E
      # job with no `/agent-flows/*` routes at all.
      METADATA_CATALOG_ENABLED: "true"
      GOVERN_ENABLED: "true"

      # `app.main` calls `validate_security_settings()` AT IMPORT, and it only
      # returns early when ENVIRONMENT is dev/development/test. The code defaults
      # are ENVIRONMENT=production with an insecure SECRET_KEY and an empty
      # DATASOURCE_ENCRYPTION_KEY, so any suite that imports app.main dies before
      # its first assertion. `test_module_floor` must import it — it walks the
      # route table rather than hand-listing endpoints — and that is how adding
      # one suite turned this job red without a product change.
      #
      # Every other backend job already sets this: integration-golden below,
      # e2e.yml, preflight.yml. docker-compose supplies it from .env, so the
      # shipping deployment never sees it. This job was the exception.
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # A TIER-1 ORACLE THAT SKIPS IS NOT COVERAGE.
      #
      # Its own step, before the suite, so the failure reads as "share_of's
      # oracle skipped" rather than being one skipped line inside a 70-suite run
      # that still exits 0. The declaration names node ids; this runs exactly
      # those and fails on missing/skipped/errored/failed.
      - name: Every tier-1 semantic oracle actually runs
        working-directory: ${{ github.workspace }}
        run: python scripts/ci/check_tier1_oracles.py

      - name: Run semantic-contract + engine unit tests (no BigQuery)
        # THE FAILURE HAS TO BE READABLE BY WHOEVER SEES IT GO RED.
        #
        # Job logs need admin rights on this repository, so a red run showed
        # "Process completed with exit code 1" and nothing else — which is how a
        # pytest USAGE error (exit 4, the whole suite skipped) went unnoticed and
        # looked the same as a real test failure. The job summary is readable
        # without admin, so the tail of the run goes there on failure.
        run: |
          set -o pipefail
          python -m pytest -q --tb=short \
            tests/test_locked_contract.py \
            tests/test_phase2_filter_propagation.py \
            tests/test_phase4_symmetric_aggregates.py \
            tests/test_filter_entry_schemas.py \
            tests/test_phase1_relationship_metadata.py \
            tests/test_distinct_self_target.py \
            tests/test_filter_layered_merge.py \
            tests/test_non_fanning_reachability.py \
            tests/test_workboard_offline_relation_phase2.py \
            tests/test_source_workboard_binding.py \
            tests/test_source_manual_ingestion.py \
            tests/test_semantic_measure_render.py \
            tests/test_dialect_structural.py \
            tests/test_agent_flow_golden.py \
            tests/test_agent_tool_registry.py \
            tests/test_tool_authorization_metadata.py \
            tests/test_tool_capability_gates.py \
            tests/test_tool_argument_contract.py \
            tests/test_tool_result_ceiling.py \
            tests/test_report_read_scope.py \
            tests/test_chart_read_failure_reason.py \
            tests/test_agent_flow_answer_contract.py \
            tests/test_builder_error_messages.py \
            tests/test_partial_context_admits_it.py \
            tests/test_chat_chart_scope.py \
            tests/test_discover_pack.py \
            tests/test_agent_flow_replay.py \
            tests/test_i5_hard_gate_stays_lowest.py \
            tests/test_tool_output_contract.py \
            tests/test_tool_node.py \
            tests/test_error_taxonomy_and_empty.py \
            tests/test_chart_discovery_and_figure_correction.py \
            tests/test_chat_thread_sharing.py \
            tests/test_coordinator_is_visible_to_the_flow.py \
            tests/test_flow_attached_but_unreadable.py \
            tests/test_flow_coordinate.py \
            tests/test_flow_synthesis_sees_all_steps.py \
            tests/test_flow_type.py \
            tests/test_followup_and_freshness.py \
            tests/test_govern_doc_citation.py \
            tests/test_govern_doc_evidence_link.py \
            tests/test_govern_knowledge_tools.py \
            tests/test_what_the_ai_sees.py \
            tests/test_read_status_survives_compaction.py \
            tests/test_diagnostics_tell_the_truth.py \
            tests/test_tree_validation_is_canonical.py \
            tests/test_nested_specialist_credentials.py \
            tests/test_ai_provider_credentials.py \
            tests/test_ai_credential_providers.py \
            tests/test_node_registry_first_load_race.py \
            tests/test_asset_resolution.py \
            tests/test_context_handoff.py \
            tests/test_verifier_false_alarms.py \
            tests/test_module_floor.py \
            tests/test_cross_lingual_resolution.py \
            tests/test_question_grounding.py \
            tests/test_reuse_evidence_equivalence.py \
            tests/test_reader_capability_boundary.py \
            tests/test_time_axis_contract.py \
            tests/test_partial_period_comparison.py \
            tests/test_grant_has_a_way_in.py \
            tests/test_nonrecoverable_retry_policy.py \
            tests/test_dead_retry_costs_nothing.py \
            tests/test_dimension_is_not_a_measure.py \
            tests/test_requested_dimension_is_not_substituted.py \
            tests/test_skill_surfaces_found_in_the_browser.py \
            tests/test_claims_mean_what_was_asked.py \
            tests/test_core_product_contracts.py \
            tests/test_source_security.py \
            tests/test_source_permissions.py \
            tests/test_source_config_contract.py \
            tests/test_source_invalidation.py \
            tests/test_source_delete_dependencies.py \
            tests/test_source_google_identity.py \
            tests/test_source_provider_contracts.py \
            tests/test_publication_boundary.py \
            tests/test_intent_contract.py \
            tests/test_alembic_revision_reconcile.py \
            tests/test_analytical_tool_semantics.py \
            tests/test_tool_certification_matrix.py \
            tests/test_capability_serviced_the_intent.py \
            tests/test_qualifier_provenance.py \
            tests/test_eval_accounting.py \
            tests/test_eval_provenance.py \
            tests/test_notice_audience_boundary.py \
            tests/test_reader_diagnostics_are_product_facing.py \
            tests/test_reader_outcome_is_not_ok_flag.py \
            tests/test_pilot_funnel_is_read_only.py \
            tests/test_reader_rating_reaches_the_run.py \
            tests/test_answer_text_is_published_not_rederived.py \
            tests/test_public_rating_trust_boundary.py \
            tests/test_adversarial_review_v3_round2.py \
            tests/test_resolver_speaks_the_questions_words.py \
            tests/test_adversarial_review_v3_closure.py \
            tests/test_documented_invariants_are_enforced.py \
            tests/test_skill_lifecycle_and_revocation.py \
            tests/test_compute_typed_contract.py \
            tests/test_budget_always_reaches_an_answer.py \
            tests/test_instruction_lifecycle.py \
            tests/test_skills_run_as_governed_children.py \
            tests/test_capability_discovery.py \
            tests/test_capability_routing_eval.py \
            tests/test_compute_owns_the_number.py \
            tests/test_compute_lineage_in_a_run.py \
            tests/test_strategy_is_pure.py \
            tests/test_governance_promises_are_kept.py \
            tests/test_canonical_time_semantics.py \
            tests/test_time_axis_needs_more_than_a_name.py \
            tests/test_time_axis_at_the_tool_boundary.py \
            tests/test_no_evidence_no_confident_number.py \
            tests/test_report_read_selection_is_explicit.py \
            tests/test_authoring_is_strict.py \
            tests/test_node_child_slots.py \
            tests/test_presentation_planner_reference_image.py \
            tests/test_dashboard_presentation_publish_is_atomic.py \
            tests/test_chart_value_normalization.py \
            tests/test_report_starter.py \
            tests/test_unified_grid_contract.py \
            tests/test_dashboard_draft_removal_lifecycle.py \
            tests/test_public_link_filter_disclosure.py \
            tests/test_embed_link_claim_operator.py \
            tests/test_public_filter_authority.py \
            tests/test_public_token_lifecycle.py \
            tests/test_dashboard_responsive_layouts.py \
            tests/test_sql_literal_security.py \
            tests/test_trusted_proxy_client_ip.py \
            tests/test_embed_integration_security.py \
            tests/test_dashboard_parameter_parity.py \
            tests/test_report_content_widgets.py \
            tests/test_semantic_router_object_access.py \
            tests/test_semantic_state_contracts.py \
            tests/test_semantic_error_contracts.py \
            tests/test_relationship_contract.py \
            tests/test_public_authoritative_bounds.py \
            tests/test_publish_candidate_generation.py \
            tests/test_semantic_health.py --junitxml=/tmp/unit.xml 2>&1 | tee /tmp/pytest-unit.log
      # WHAT ACTUALLY RAN, ON A GREEN RUN TOO.
      #
      # The step below reports failures. Nothing reported SUCCESS, so a
      # reviewer reading a green run could not answer the only question that
      # matters about it: what did it execute? That is not pedantry here - a
      # pytest usage error exits 4 with zero tests collected, and once did,
      # and the tier looked exactly as green as a real 1,700-test run.
      #
      # Counts come from the JUnit report, never from a hardcoded expected
      # number: an expectation that has to be edited whenever a suite is added
      # is an expectation that gets edited to whatever the run produced.
      - name: Say what actually ran
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib, sys, xml.etree.ElementTree as ET

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          out = open(summary, 'a', encoding='utf-8') if summary else sys.stdout
          path = pathlib.Path('/tmp/unit.xml')
          if not path.exists():
              print('## Backend semantic-contract - NO REPORT', file=out)
              print(file=out)
              print('pytest produced no JUnit file, so it did not get as far as', file=out)
              print('running tests. This tier is NOT VERIFIED.', file=out)
              print('::error title=semantic-contract::no JUnit report - pytest never ran')
              sys.exit(1)

          root = ET.parse(path).getroot()
          suites = [root] if root.tag == 'testsuite' else list(root)
          total = sum(int(s.get('tests', 0)) for s in suites)
          failures = sum(int(s.get('failures', 0)) for s in suites)
          errors = sum(int(s.get('errors', 0)) for s in suites)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          seconds = sum(float(s.get('time', 0) or 0) for s in suites)
          passed = total - failures - errors - skipped

          print('## Backend semantic-contract', file=out)
          print(file=out)
          print('| collected | passed | failed | errors | skipped | duration |', file=out)
          print('|---:|---:|---:|---:|---:|---:|', file=out)
          print(f'| {total} | {passed} | {failures} | {errors} | {skipped} |'
                f' {seconds:.1f}s |', file=out)
          if out is not sys.stdout:
              out.close()

          # ZERO COLLECTED IS NOT SUCCESS. This is the case the tier was
          # blind to, and the one a green tick hides most completely.
          if total == 0:
              print('::error title=semantic-contract::0 tests collected - the suite did not run')
              sys.exit(1)
          print(f'::notice title=semantic-contract::{total} collected, {passed} passed,'
                f' {failures} failed, {errors} errors, {skipped} skipped in {seconds:.1f}s')
          PY

      - name: Report the unit failure where it can be read
        if: failure()
        # AS ANNOTATIONS, not a job summary.
        #
        # `$GITHUB_STEP_SUMMARY` does not reach the check-run payload — it comes
        # back empty to anyone reading the API. `::error::` lines do, through
        # /check-runs/{id}/annotations, with no token: that is how the Playwright
        # job's failures became readable. Job logs remain admin-only, which is the
        # whole reason this step exists.
        run: |
          log=/tmp/pytest-unit.log
          if [ ! -s "$log" ]; then
            echo "::error::the unit step produced no log — it failed before pytest started"
            exit 0
          fi
          # The short summary pytest prints at the end: one line per failure.
          grep -E '^(FAILED|ERROR)' "$log" | head -n 25 | while IFS= read -r line; do
            echo "::error::$line"
          done
          # And the counts, so "3 failed" is visible even if the names are cut.
          tail -n 3 "$log" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done

  # ── Tier 2: integration (golden replay on a real Postgres) ─────────────────
  integration-golden:
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # THE SAME IMAGE docker-compose.yml runs, and it has to be.
        #
        # This was `postgres:15`, which carries no pgvector, so
        # `20260321_0006_add_column_stats_and_embeddings` died on
        # `CREATE EXTENSION IF NOT EXISTS vector` and took every job that builds
        # the schema with it — integration-golden here, and `Build the schema` in
        # the E2E workflow. Both had been red since the extension was introduced,
        # on every commit, for reasons that had nothing to do with the commit.
        #
        # A CI database on a different major version than the one that ships is
        # its own latent bug, so this pins to compose rather than to
        # `pgvector/pgvector:pg15`.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: appbi
          POSTGRES_PASSWORD: appbi
          POSTGRES_DB: appbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # appbi metadata DB (alembic + SessionLocal) AND the bcfix source DB are
      # the same Postgres service — bcfix is just a schema in it (mirrors dev).
      DATABASE_URL: "postgresql://appbi:appbi@localhost:5432/appbi"
      PYTHONPATH: ${{ github.workspace }}/backend
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: appbi
      DB_USER: appbi
      DB_PASSWORD: appbi
      # No encryption key in CI → datasource creds stored plaintext, so both the
      # schema-inference and the chart-execution paths connect with "appbi".
      DATASOURCE_ENCRYPTION_KEY: ""
      ENVIRONMENT: test
      # Opt-in required by seed_snowflake_ci_fixture.py (it DROPs schema 'bcfix'
      # and force-assigns fixed ids — disposable CI DB only).
      CI_FIXTURE_SEED: "1"
      # Outbound source policy (spec: docs/features/source-core-hardening). The
      # fixture data source points at this job's Postgres service on localhost,
      # which resolves to 127.0.0.1 AND ::1; loopback is refused unless listed
      # explicitly. Scripts run here (regression_filter_matrix.py, parity) do not
      # load tests/conftest.py, so the allowance has to be in the job env.
      ALLOWED_PRIVATE_SOURCE_CIDRS: "127.0.0.0/8,::1/128"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Build appbi metadata schema (alembic)
        run: alembic upgrade head

      - name: Seed snowflake fixture (dataset + model + measures + golden charts)
        run: python scripts/seed_snowflake_ci_fixture.py

      - name: GATE — golden replay (full snowflake suite, all PowerBI-correct)
        run: python scripts/regression_filter_matrix.py --verify --tag snowflake

      - name: GATE — Explore preview == Dashboard tile parity (same query, both BE paths)
        run: python scripts/test_explore_dashboard_parity.py

      # The semantic engine's VALUE matrix: every case executes its SQL on this
      # Postgres and compares rows with a hand-computed answer (star, 3-role
      # date, diamond, galaxy at different grains, chasm, M:N bridge, composite
      # key, timezone). It refuses to run on anything but Postgres, so it can
      # never pass by skipping.
      - name: GATE — semantic golden value matrix (executed on Postgres)
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_semantic_golden_matrix.py

      # Slicer cascade on the seeded fixture: Postgres values against a truth
      # from the raw tables, and the BigQuery SQL shape (one INNER JOIN
      # semi-join; nothing BigQuery rejects).
      - name: GATE — distinct cascade values + BigQuery semi-join shape
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_distinct_cascade_semijoin.py

      # Every saved fixture chart's SQL on Postgres AND BigQuery vs the
      # committed baseline (tests/golden_sql/snowflake_ci.json).
      - name: GATE — generated SQL non-regression (Postgres + BigQuery)
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_golden_sql_non_regression.py

      # The same chart's VALUES on the saved-chart, dashboard-tile and public-link
      # routes (real HTTP routes, fixture charts), unfiltered and under a filter
      # locked on the link vs the same filter at runtime on the dashboard.
      - name: GATE — cross-surface value parity (saved / dashboard / public)
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_surface_parity.py

      # Relationship authoring <-> join resolver, executed: reverse-edge values
      # (composite keys, calendar CAST), the to-one key guard on real data, and
      # two sessions racing one model under the model write lock.
      - name: GATE — relationship contract on Postgres (values + key guard + races)
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_relationship_contract_pg.py

      # Authored device layouts on Postgres: the JSONB column, the row-locked
      # draft write, Publish's revision check and duplication, through the real
      # application (docs/responsive-dashboard-layouts.md).
      - name: GATE — authored device layouts (Postgres)
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_dashboard_responsive_layouts_pg.py

      # Server-owned public constraints (lock, hidden, page scope, link scope)
      # are applied or the request is refused — on the real public routes.
      - name: GATE — public authoritative constraints fail closed (real routes)
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_public_authoritative_bounds_pg.py

      # Old-correct → new-correct: business numbers captured from the
      # pre-Pair-1 engine (tests/golden_sql/pair1_baseline.json) reproduced
      # by the current one — engine, snapshot-backed, every route, direct API.
      - name: GATE — pre-Pair-1 business-number parity
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_pair1_baseline_parity.py

      # Resolver ↔ query engine (Pair #2): one request, one business meaning.
      # Hand-computed values for every topology (star, snowflake, role diamond,
      # chasm, galaxy, three facts, role-playing dates, composite key, bridge,
      # NULL keys, ties), executed on Postgres AND DuckDB, re-asked under every
      # order permutation (relationships, explores, measures, dims, filters,
      # node-set order, a fresh graph): same rows or the same refusal category.
      - name: "GATE — Pair 2 golden topology + order invariance (Postgres + DuckDB)"
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_pair2_golden_topology_pg.py

      # Query engine ↔ ChartService (Pair #3): the engine's meaning survives
      # routing, filtering, planning, caching, execution and reshaping. Every
      # Pair 2 golden request asked THROUGH ChartService (saved chart, preview,
      # stale / minimal / empty / legacy bindings) on a real datasource; cache
      # mutations (model / measure / filter / generation / scope / host);
      # live adapter == engine rows; snapshot→live fallback on the source
      # engine; refusal categories over HTTP; field identity of the result.
      - name: "GATE — Pair 3 query engine ↔ ChartService (Postgres)"
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_pair3_chartservice_pg.py

      # Semantic foundation (Pair 1 + 2 + 3 as one kernel contract): numeric
      # meaning (true division, NULL on a zero denominator) on Postgres + DuckDB
      # and through ChartService; a cross-view formula refused; the same request
      # through every entry point (chart saved / preview, /semantic/query,
      # dataset execute, measure preview) gives the same rows or refusal
      # category; soft drops reported everywhere; one live statement reads one
      # connection.
      - name: "GATE — Semantic foundation kernel contract (Postgres + DuckDB)"
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_semantic_foundation_pg.py

      # ChartService ↔ every consuming surface (Pair #4): the Kernel's answer
      # asked THROUGH the authenticated tile, the public single chart (/d,
      # /embed, the PDF worker), the public batch, the public slicer and the AI
      # chart read / preview: same rows or the same refusal category; a soft
      # drop shown without internals; authoritative constraints fail closed; a
      # filter of another dataset never applies; per-tile batch isolation; a
      # cache slot per link scope; the AI never told a dropped filter applied.
      - name: "GATE — Pair 4 surfaces (Postgres)"
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_pair4_surfaces_pg.py

      # Source / Data Prep / Snapshot <-> Drift / Health / Quality /
      # Observability (Pair #5): a calculated column is the Kernel's true
      # division on every engine; the transformation chain runs in order or
      # refuses; the snapshot extract, quality, health and monitors read the
      # SAME logical relation charts read; a source schema change is seen (and
      # named) by the monitor and the schema_drift rule; an error / no-data /
      # still-learning check is never a pass; a failed or mid-sync-edited
      # candidate is never published; publish and rebuild exclude each other.
      - name: "GATE — Pair 5 data state (Postgres)"
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_pair5_data_state_pg.py

      # Source update concurrency (real row locks): the connection test runs
      # with no transaction / row lock held; an update committed during the
      # test makes the stale save 409 source_conflict instead of overwriting.
