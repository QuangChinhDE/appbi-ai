name: Product gate
true:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  classify:
    name: Which suites does this diff need?
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.map.outputs.backend }}
      e2e: ${{ steps.map.outputs.e2e }}
      changed: ${{ steps.map.outputs.changed }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Map the changed paths onto suites
      id: map
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: "set -euo pipefail\n# THE RANGE HAS TO RESOLVE OR THIS IS NOT A CLASSIFICATION.\n\
        # An unresolvable base is the one case where guessing is worse than\n# running\
        \ everything: \"I could not tell\" must not read as \"nothing is\n# relevant\"\
        , which is exactly how a gate goes green for free.\nif ! git rev-parse --verify\
        \ \"$BASE^{commit}\" >/dev/null 2>&1; then\n  echo \"::warning::base $BASE\
        \ does not resolve — treating every suite as relevant\"\n  echo \"backend=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"e2e=true\" >> \"$GITHUB_OUTPUT\"\n  echo\
        \ \"changed=<unresolvable base>\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\nfiles=$(git\
        \ diff --name-only \"$BASE...$HEAD\")\nif [ -z \"$files\" ]; then\n  echo\
        \ \"::warning::empty diff — treating every suite as relevant\"\n  files=\"\
        <empty diff>\"\n  backend=true; e2e=true\nelse\n  backend=false; e2e=false\n\
        \  # The map is the union of what those workflows already filter on,\n  #\
        \ plus the two places a RUNTIME contract lives outside `backend/`.\n  while\
        \ IFS= read -r f; do\n    # THE PATTERNS ARE ON ONE LINE EACH, deliberately.\
        \ A backslash\n    # continuation followed by CR+LF is not a continuation\
        \ to bash,\n    # and a workflow whose correctness depends on its line endings\n\
        \    # breaks the first time someone edits it on Windows.\n    case \"$f\"\
        \ in\n      backend/*|.github/workflows/backend-contract-tests.yml|.github/workflows/product-gate.yml|frontend/src/components/explore/*|frontend/src/lib/explore-query.ts|scripts/guardrail/guardrail_rules.yaml|scripts/cert/*)\n\
        \        backend=true ;;\n    esac\n    case \"$f\" in\n      backend/*|frontend/*|e2e/*|.github/workflows/e2e.yml|.github/workflows/product-gate.yml)\n\
        \        e2e=true ;;\n    esac\n  done <<< \"$files\"\nfi\necho \"backend=$backend\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"e2e=$e2e\" >> \"$GITHUB_OUTPUT\"\n{\n  echo\
        \ \"changed<<EOF\"\n  echo \"$files\" | head -n 60\n  echo \"EOF\"\n} >> \"\
        $GITHUB_OUTPUT\"\n{\n  echo \"### Product gate — what this diff needs\"\n\
        \  echo \"\"\n  echo \"| suite | relevant |\"\n  echo \"|---|---|\"\n  echo\
        \ \"| backend semantic contract + integration-golden | \\`$backend\\` |\"\n\
        \  echo \"| end-to-end | \\`$e2e\\` |\"\n  echo \"\"\n  echo \"<details><summary>changed\
        \ paths</summary>\"\n  echo \"\"\n  echo '```'\n  echo \"$files\" | head -n\
        \ 60\n  echo '```'\n  echo \"\"\n  echo \"</details>\"\n} >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
  backend:
    name: Backend semantic contract
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    uses: ./.github/workflows/backend-contract-tests.yml
  e2e:
    name: End-to-end
    needs: classify
    if: needs.classify.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml
  product-gate:
    name: Product gate
    runs-on: ubuntu-latest
    needs:
    - classify
    - backend
    - e2e
    if: always()
    steps:
    - name: Every suite this diff needed must have passed
      env:
        NEEDED_BACKEND: ${{ needs.classify.outputs.backend }}
        NEEDED_E2E: ${{ needs.classify.outputs.e2e }}
        RESULT_CLASSIFY: ${{ needs.classify.result }}
        RESULT_BACKEND: ${{ needs.backend.result }}
        RESULT_E2E: ${{ needs.e2e.result }}
      run: "python3 - <<'PY'\nimport os, sys\n\nrows, failures = [], []\n\n# If the\
        \ classification itself did not succeed, nothing below it can be\n# trusted\
        \ — including the \"not relevant\" answers.\nif os.environ[\"RESULT_CLASSIFY\"\
        ] != \"success\":\n    failures.append(\n        \"classification did not\
        \ succeed \"\n        f\"({os.environ['RESULT_CLASSIFY']!r}); relevance is\
        \ unknown, so \"\n        \"no suite can be called irrelevant\"\n    )\n\n\
        for label, needed_key, result_key in (\n    (\"backend semantic contract +\
        \ integration-golden\", \"NEEDED_BACKEND\", \"RESULT_BACKEND\"),\n    (\"\
        end-to-end\", \"NEEDED_E2E\", \"RESULT_E2E\"),\n):\n    needed = os.environ.get(needed_key)\
        \ == \"true\"\n    result = os.environ.get(result_key) or \"(did not run)\"\
        \n    if not needed:\n        rows.append((label, \"not relevant\", result,\
        \ \"ok\"))\n        continue\n    if result == \"success\":\n        rows.append((label,\
        \ \"REQUIRED\", result, \"ok\"))\n        continue\n    # Relevant and anything\
        \ other than success — skipped included, and\n    # skipped is the dangerous\
        \ one: it is what a disappeared job looks\n    # like, and it must never read\
        \ as \"irrelevant\".\n    rows.append((label, \"REQUIRED\", result, \"FAILED\"\
        ))\n    failures.append(f\"{label}: required for this diff but concluded {result!r}\"\
        )\n\nsummary = os.environ.get(\"GITHUB_STEP_SUMMARY\")\nout = open(summary,\
        \ \"a\", encoding=\"utf-8\") if summary else sys.stdout\nprint(\"## Product\
        \ gate\", file=out)\nprint(file=out)\nprint(\"| suite | required for this\
        \ diff | conclusion | |\", file=out)\nprint(\"|---|---|---|---|\", file=out)\n\
        for label, needed, result, verdict in rows:\n    print(f\"| {label} | {needed}\
        \ | `{result}` | {verdict} |\", file=out)\nprint(file=out)\nif failures:\n\
        \    print(\"**This diff's suites did not all pass.**\", file=out)\n    for\
        \ f in failures:\n        print(f\"- {f}\", file=out)\nelse:\n    print(\"\
        Every suite this diff needed concluded `success`.\", file=out)\nif out is\
        \ not sys.stdout:\n    out.close()\n\nfor f in failures:\n    print(f\"::error\
        \ title=Product gate::{f}\")\nsys.exit(1 if failures else 0)\nPY\n"
