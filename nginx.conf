# ============================================================
# AppBI - Nginx Configuration
# Routes only the active core stack:
#   Frontend  (Next.js) : 127.0.0.1:3000
#   Backend   (FastAPI) : 127.0.0.1:8000
# ============================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── Scale hardening (4 vCPU / 16 GB VM) ─────────────────────────────────
    # Keepalive upstreams: reuse TCP+TLS-free connections to the app instead of a
    # fresh socket per request — meaningful under a burst of many viewers. Also
    # the seam for horizontal scale later (add more `server` lines here).
    upstream appbi_backend  { server 127.0.0.1:8000; keepalive 32; }
    upstream appbi_frontend { server 127.0.0.1:3000; keepalive 64; }

    # Per-IP flood protection in FRONT of uvicorn: a single abusive IP is dropped
    # cheaply by nginx before it can tie up a Python worker. Generous enough that
    # a genuine viewer (one page = one batch request + a few tiles) never trips it
    # — the app's own per-viewer slowapi limits are the real business ceiling.
    limit_req_zone  $binary_remote_addr zone=api_rl:10m   rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Cache the immutable Next.js build assets AT nginx so 30+ cold browsers don't
    # each proxy the ~3MB JS through the Node process. Browsers still cache them
    # for a year (header below); this only offloads the first hit per asset.
    proxy_cache_path /var/cache/nginx/next levels=1:2 keys_zone=next_static:20m
                     max_size=2g inactive=30d use_temp_path=off;

    server {
        listen 80;
        listen [::]:80;
        server_name report.base-datateam.com;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name report.base-datateam.com;

        ssl_certificate /etc/letsencrypt/live/report.base-datateam.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/report.base-datateam.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        client_max_body_size 250m;

        allow 127.0.0.1;
        allow ::1;
        allow 14.232.245.131;
        allow 222.252.17.120;
        allow 193.186.4.156;
        allow 113.190.230.3;
        allow 42.118.44.150;
        allow 14.161.49.226;
        allow 42.118.122.97;
        allow 118.69.12.18;
        allow 34.68.128.35;
        allow 42.114.24.80;
        allow all;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: https://accounts.google.com/gsi/; img-src 'self' data: blob: https://*.gstatic.com https://*.googleusercontent.com https://server.arcgisonline.com https://*.arcgisonline.com; font-src 'self' data:; frame-src 'self' https://accounts.google.com/gsi/; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

        location /embed/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: https://accounts.google.com/gsi/; img-src 'self' data: blob: https://*.gstatic.com https://*.googleusercontent.com https://server.arcgisonline.com https://*.arcgisonline.com; font-src 'self' data:; frame-src 'self' https://accounts.google.com/gsi/; frame-ancestors *; base-uri 'self'; form-action 'self'" always;
            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
        }

        location /_next/static/ {
            proxy_pass http://appbi_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";          # enable upstream keepalive
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache next_static;
            proxy_cache_valid 200 301 302 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_lock on;                     # collapse concurrent cold fills
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location /api/v1/ {
            # First-line per-IP flood guard (generous burst passes genuine spikes).
            limit_req  zone=api_rl burst=60 nodelay;
            limit_conn api_conn 50;
            proxy_pass http://appbi_backend/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";          # enable upstream keepalive
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
