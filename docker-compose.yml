# ============================================================
# AppBI Core BI Stack
#
# Start base stack:
#   docker compose up --build -d
#
# ============================================================

services:
  db:
    profiles: ["local-db"]
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Tuned for the 4-vCPU / 16GB VM. max_connections=250 is the ceiling the
    # backend pool math (4 workers × 40 + pdf-worker) sits under; the memory
    # settings are conservative because Postgres shares the box with the API,
    # frontend and (optionally) the Chromium pdf-worker. If you point the stack
    # at an EXTERNAL/managed Postgres (DATABASE_URL set), apply the same
    # max_connections there — this command only affects the bundled local-db.
    command:
      - "postgres"
      - "-c"
      - "max_connections=250"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=4GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_wal_size=2GB"
    environment:
      POSTGRES_USER: ${DB_USER:-appbi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-appbi}
      POSTGRES_DB: ${DB_NAME:-appbi}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Provision pgvector at first init, as the postgres superuser (the app
      # account is use-only and never creates extensions).
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appbi} -d ${DB_NAME:-appbi}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      appbi-net:
        aliases:
          - appbi-db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Optional full override for external PostgreSQL (SSL params, managed URIs).
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-appbi-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-appbi}
      DB_PASSWORD: ${DB_PASSWORD:-appbi}
      DB_NAME: ${DB_NAME:-appbi}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://frontend:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTH_PASSWORD_LOGIN_ENABLED: ${AUTH_PASSWORD_LOGIN_ENABLED:-true}
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_DATA_REDIRECT_URI: ${AUTH_GOOGLE_DATA_REDIRECT_URI:-}
      AUTH_GOOGLE_ALLOWED_DOMAINS: ${AUTH_GOOGLE_ALLOWED_DOMAINS:-}
      AUTH_GOOGLE_AUTO_CREATE_USERS: ${AUTH_GOOGLE_AUTO_CREATE_USERS:-false}
      AUTH_GOOGLE_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_GOOGLE_BOOTSTRAP_ADMIN_EMAIL:-}
      API_RELOAD: "false"
      # uvicorn worker count (read by entrypoint.sh). Default 4 = one per core on
      # the recommended 4-vCPU VM; override WEB_CONCURRENCY in .env for other
      # sizes. Each worker keeps its OWN DB pool, so this is coupled to the pool
      # sizes below and to Postgres max_connections (local-db sets it to 250).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      # Per-worker SQLAlchemy pool. get_db holds a connection for the whole
      # request (incl. the brief public-meta coalescing wait on a cold burst), so
      # 40/worker is sized to absorb a realistic concurrent-view burst. Ceiling
      # rule: (POOL_SIZE + MAX_OVERFLOW) × WEB_CONCURRENCY (+ pdf-worker) MUST stay
      # under Postgres max_connections. Defaults: 4 × (20+20) = 160, + pdf ≈ 40,
      # under the local-db max_connections=250 below.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Workboard module — bundled with the core stack.
      WORKBOARDS_ENABLED: ${WORKBOARDS_ENABLED:-true}
      # Web Push (VAPID) for mini-app notifications — set in .env (keys never committed).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY_B64: ${VAPID_PRIVATE_KEY_B64:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@appbi.io}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@appbi.io}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      DATA_DIR: /app/.data
      # Server-side PDF export: the API only accepts render jobs when a
      # pdf-worker is actually running (compose profile "pdf"). Otherwise the
      # frontend keeps using the in-browser exporter.
      PDF_EXPORT_ENABLED: ${PDF_EXPORT_ENABLED:-false}
      PDF_FILE_TTL_HOURS: ${PDF_FILE_TTL_HOURS:-48}
      PDF_QUOTA_PER_LINK_HOUR: ${PDF_QUOTA_PER_LINK_HOUR:-20}
      PDF_QUOTA_PER_USER_HOUR: ${PDF_QUOTA_PER_USER_HOUR:-60}
      DATASOURCE_ENCRYPTION_KEY: ${DATASOURCE_ENCRYPTION_KEY:-}
      GCP_SERVICE_ACCOUNT_JSON: ${GCP_SERVICE_ACCOUNT_JSON:-}
      GCP_SERVICE_ACCOUNT_EMAIL: ${GCP_SERVICE_ACCOUNT_EMAIL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - appbi_data:/app/.data
    ports:
      # Bind to 127.0.0.1 so the backend is reachable only via nginx,
      # not directly from the public internet.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      - appbi-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL is baked as a relative path so it works on any domain.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_AUTH_PASSWORD_LOGIN_ENABLED: ${NEXT_PUBLIC_AUTH_PASSWORD_LOGIN_ENABLED:-true}
        NEXT_PUBLIC_AUTH_GOOGLE_ENABLED: ${NEXT_PUBLIC_AUTH_GOOGLE_ENABLED:-false}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        # WebSocket cannot be proxied through Next.js rewrites — must be baked.
        NEXT_PUBLIC_WORKBOARDS_ENABLED: ${NEXT_PUBLIC_WORKBOARDS_ENABLED:-true}
        # PDF export delivery: false = progress on the report + download only;
        # true also opens the finished file in a second tab. Baked at build time.
        NEXT_PUBLIC_PDF_PREVIEW_TAB: ${NEXT_PUBLIC_PDF_PREVIEW_TAB:-false}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000/api/v1
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NEXT_PUBLIC_AUTH_PASSWORD_LOGIN_ENABLED: ${NEXT_PUBLIC_AUTH_PASSWORD_LOGIN_ENABLED:-true}
      NEXT_PUBLIC_AUTH_GOOGLE_ENABLED: ${NEXT_PUBLIC_AUTH_GOOGLE_ENABLED:-false}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_WORKBOARDS_ENABLED: ${NEXT_PUBLIC_WORKBOARDS_ENABLED:-true}
      NEXT_PUBLIC_PDF_PREVIEW_TAB: ${NEXT_PUBLIC_PDF_PREVIEW_TAB:-false}
    ports:
      # Bind to 127.0.0.1 so the frontend is reachable only via nginx,
      # not directly from the public internet.
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - appbi-net

  # ── PDF render worker (server-side export engine) ──────────────────────
  # Opt-in: `docker compose --profile pdf up -d pdf-worker`, with
  # PDF_EXPORT_ENABLED=true in .env so the API starts accepting export jobs.
  # Without it the app still exports — in the viewer's browser — so the base
  # stack stays light (this image carries Chromium, ~600MB).
  pdf-worker:
    profiles: ["pdf"]
    build:
      context: .
      dockerfile: backend/Dockerfile.pdf
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-appbi-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-appbi}
      DB_PASSWORD: ${DB_PASSWORD:-appbi}
      DB_NAME: ${DB_NAME:-appbi}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_DIR: /app/.data
      DATASOURCE_ENCRYPTION_KEY: ${DATASOURCE_ENCRYPTION_KEY:-}
      PDF_EXPORT_ENABLED: "true"
      # Container-to-container URL of the report frontend.
      PDF_RENDER_BASE_URL: ${PDF_RENDER_BASE_URL:-http://frontend:3000}
      PDF_RENDER_PAGE_TIMEOUT: ${PDF_RENDER_PAGE_TIMEOUT:-120}
      PDF_FILE_TTL_HOURS: ${PDF_FILE_TTL_HOURS:-48}
    volumes:
      # SAME volume as the backend: the worker writes the PDF, the API serves it.
      - appbi_data:/app/.data
    # Chromium needs more than Docker's default 64MB /dev/shm or it crashes on
    # bigger reports.
    shm_size: "1gb"
    # Hard resource ceiling so a heavy render (Chromium is the memory/CPU hog on
    # the box) can NEVER starve the API/DB on the shared 4-vCPU / 16GB VM. The
    # worker processes render jobs and every render drives a full report's worth
    # of chart-data through the backend, so keep it boxed in; per-link/user hourly
    # quotas (PDF_QUOTA_*) already bound how often it runs.
    cpus: "1.5"
    mem_limit: "2g"
    depends_on:
      - backend
    networks:
      - appbi-net

volumes:
  db_data:
  appbi_data:

networks:
  appbi-net:
    name: appbi-net
    driver: bridge
