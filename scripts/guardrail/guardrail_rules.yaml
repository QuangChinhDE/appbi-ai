    locks: "PLAIN/JOIN_CHAIN/EXISTS/DROP routing, fan-out detection, unreachable/ambiguous"
  layered_merge:
    run: "pytest backend/tests/test_filter_layered_merge.py"
    locks: "filter precedence (link_locked>dashboard_locked>visible>viewer_slicer>chart_base), empty-lock no-op"
  distinct_self_target:
    run: "pytest backend/tests/test_distinct_self_target.py"
    locks: "slicer dropdown excludes its own field; other filters cascade in"
  symmetric_agg:
    run: "pytest backend/tests/test_phase4_symmetric_aggregates.py"
    locks: "Looker MD5 dedup per dialect + fallback"
  measure_render:
    run: "pytest backend/tests/test_semantic_measure_render.py"
    locks: "measure composition: agg wrapper, count_distinct, expression-over-sql, filters/where_sql CASE WHEN wrap + AND-join, quote escaping, BUG-018 unquoted numeric literal, ratio depends_on, circular/unknown fail-loud"
  dialect_structural:
    run: "pytest backend/tests/test_dialect_structural.py"
    locks: "BigQuery-vs-Postgres SQL SHAPE without a warehouse: SAFE_CAST/FLOAT64 vs REGEXP guard, numeric literal never quoted, dialects provably diverge, symmetric-aggregate dialect allow-list, superseded engine flags stay OFF"
  relationship_metadata:
    run: "pytest backend/tests/test_phase1_relationship_metadata.py"
    locks: "cardinality normalize, bidirectional edges, BFS path, ambiguity"
  error_contracts:
    run: "pytest backend/tests/test_semantic_error_contracts.py"
    locks: "semantic refusals are ValueErrors (so every endpoint answers 400) in Vietnamese, naming the field/view and where to fix it (ambiguous route, unsupported context modifier, unknown operator, aggregate-incompatible measure filter, unreachable view); GET /charts/{id}/data and POST /semantic/query map ValueError→400 and anything else→500, the latter logged with explore + dialect. Asserted on behaviour — replaces the untracked source-grep suite"
  explore_dashboard_parity:
    requires: postgres-fixture
    run: "python backend/scripts/test_explore_dashboard_parity.py"
    locks: "preview SQL/data == dashboard tile"
  tsc:
    run: "cd frontend && npx tsc --noEmit"
    locks: "frontend type-safety (schema/prop changes)"
  browser_verify:
    status: manual
    run: "rebuild FE standalone + docker cp + restart, then Playwright verify vs the RUNNING build (static audits miss runtime/build-staleness)"
    locks: "FE change actually renders/behaves in a real build (not just source)"
  import_smoke:
    status: manual
    run: "docker cp <file> into backend + restart + hit the touched endpoint (lazy imports hide errors)"
    locks: "no import/attribute error on the touched runtime path"

# ─────────────────────────────────────────────────────────────────────────────
# 5. INVARIANTS — diff-scanned business/architecture rules. Each has a file
#    `scope` (only checked when a changed file matches), and either
#    `added_patterns` (regex whose APPEARANCE in added lines is a risk) or
#    `removed_patterns` (regex whose REMOVAL is a risk). Matches are RISK SIGNALS
#    (not proofs) → they point at the gate to run. From Regression-Catalog + memory.
# ─────────────────────────────────────────────────────────────────────────────
invariants:
  # GROUNDED (verified L3017/3115/3218/3037). Guards the PRESENCE of the
  # de-correlation fix — a diff removing its markers undoes it.
  - id: agent_flow_container_topology
    label: "A container node's child slots are declared once and every traversal reads them"
    scope: ["frontend/src/lib/agentFlows.ts",
            "backend/app/services/agent_flows/contract.py",
            "backend/app/services/agent_flows/runtime/nodes.py"]
    removed_patterns: ['child_slots', 'CHILD_SLOTS']
    severity: high
    message: >
      A node type that HOLDS other nodes must declare WHERE its children live, and
      every traversal must read that declaration instead of re-deriving it. The cost
      of the old way is on the record: `coordinate` was added without teaching
      `all_nodes()`, a specialist's lane became invisible to every authoring check at
      once, and asked which category earned the most the flow answered
      "13,591,643.70" — the report's grand total, no category named, no notice.
    tests: [agent_flow_container, agent_flow_replay]

  - id: agent_flow_answer_parity
    label: "The answer envelope has one renderer; no surface flattens blocks privately"
    scope: ["frontend/src/components/agent-flows/TestChat.tsx",
            "frontend/src/components/chat/ConversationView.tsx",
            "frontend/src/components/dashboards/AnswerBlocks.tsx"]
    # SINGLE LINE, because a diff only carries the lines that CHANGED. The first
    # attempt keyed on the full idiom `=> b.markdown).filter`, which spans two
    # lines — the `.filter` is unchanged context and never reaches the matcher, so
    # the guard silently passed a real reintroduction. Caught by mutation-testing
    # it rather than by reading it.
    #
    # Safe to key this tightly now: the explanation in TestChat.tsx describes the
    # bug in prose instead of quoting the code, so the guard no longer fires on the
    # comment that documents it.
    added_patterns: ['\.map\(\s*\(?\s*\w+\s*\)?\s*=>\s*\w+\.markdown\s*\)']
    severity: high
    message: >
      Studio, Direct Chat and the dashboard bot read the same blocks. A surface that
      flattens them to `.markdown` shows its author a degraded copy of what the reader
      gets — measured: a valid `metric` answer rendered as an em-dash while the run
      reported `ok` and raised no notice.
    tests: [agent_flow_contract]

  - id: distinct_decorrelation_semijoin
    label: "Distinct cascade must stay a de-correlated UNION-DISTINCT / INNER JOIN semi-join (BigQuery)"
    scope: ["backend/app/services/dataset_model_service.py"]
    removed_patterns: ['_appbi_semi_key', 'UNION DISTINCT']
    added_patterns: ['\)\s+OR\s+_appbi_base']
    severity: high
    message: >
      The distinct cascade was de-correlated EXISTS→IN→INNER JOIN. Verified real
      markers: `_appbi_semi_key` (semi-join key, L3017/3219), `UNION DISTINCT`
      merge (L3115), INNER JOIN emission (L3218). REMOVING them — or ORing
      `_appbi_base` IN-subqueries — re-creates the BigQuery-invalid correlated /
      OR-of-INs / IN-over-aggregated form. Postgres HIDES it (an `EXISTS (` in
      source is the LEGIT composite-key fallback at L3037, NOT a regression).
    tests: [distinct_cascade_bq, galaxy_golden]

  # GROUNDED (verified L1848/2010). Cross-fact measure correctness.
  - id: measure_isolation_present
    label: "Cross-fact measure isolation + multi-fact stitch must remain (no double-count)"
    scope: ["backend/app/services/semantic_query_engine.py"]
    removed_patterns: ['_build_isolated_measure_subquery', '_build_dimensioned_multifact_sql']
    severity: high
    message: >
      Cross-fact measures are isolated at their own grain (`_build_isolated_measure_subquery`
      L1848) and multi-fact results stitched (`_build_dimensioned_multifact_sql` L2010).
      Removing either re-introduces base-scope contamination / cross-fact double-count.
    tests: [galaxy_golden, golden_sql, measure_render]

  # GROUNDED (verified L4031). Chasm fail-loud.
  - id: group_grain_validator_present
    label: "Chasm group-grain validator must remain (fail-loud, not silent fan-out)"
    scope: ["backend/app/services/semantic_query_engine.py"]
    removed_patterns: ['_validate_group_grain']
    severity: high
    message: >
      `_validate_group_grain` (L4031) fails loud when a grouped dim isn't M:1-reachable
      (chasm) — removing it lets a chasm group-by silently produce non-deterministic
      wrong totals.
    tests: [filter_matrix, galaxy_golden]

  # GROUNDED (verified dataset_model_service L1425/1364, engine _coerce/_filter_type_family).
  - id: type_family_coercion_present
    label: "Filter literal type-coercion must remain (INT64=STRING fix)"
    scope: ["backend/app/services/dataset_model_service.py", "backend/app/services/semantic_query_engine.py"]
    removed_patterns: ['_coerce_typed_filter_value', '_filter_type_family']
    severity: medium
    message: >
      Filter literals are coerced to the column's type-family (`_coerce_typed_filter_value` /
      `_filter_type_family`) so a numeric column vs a STRING slicer value doesn't emit
      `year BETWEEN '2023' AND '2024'` → BigQuery 400. Removing it re-breaks numeric filters on BQ.
    tests: [galaxy_golden, filter_matrix, golden_sql]

  - id: distinct_strict_no_showall
    label: "Distinct cascade must stay strict (no show-all fallback)"
    scope: ["backend/app/services/dataset_model_service.py", "backend/app/api/public.py"]
    added_patterns: ['security_only\s*=\s*True', 'show[_-]?all', 'fallback.*full.*domain']
    severity: high
    message: >
      A slicer dropdown cascades STRICTLY by other filters (PBI parity). Do NOT
      relax to the full domain when the cascade is empty (the reverted "no-trap").
      Empty cascade → empty dropdown, never show-all.
    tests: [galaxy_golden]

  - id: distinct_self_exclude
    label: "Distinct query must strip a filter on its own target field"
    scope: ["backend/app/services/dataset_model_service.py"]
    removed_patterns: ['_distinct_filter_targets_self', 'targets_self']
    severity: medium
    message: "Removing self-field stripping re-pins a slicer dropdown to its own current value."
    tests: [distinct_self_target]

  # GROUNDED (verified L3543). Broad `LEFT JOIN` add was blind (LEFT JOIN is
  # used legitimately everywhere) → guard the EXISTS builder's presence instead.
  - id: fanout_exists_builder_present
    label: "Filter-only 1:N joins must go through the EXISTS builder (no fan-out double-count)"
    scope: ["backend/app/services/semantic_query_engine.py"]
    removed_patterns: ['_build_filter_exists_clause']
    severity: high
    message: >
      Filter-only reachability is rendered as EXISTS via `_build_filter_exists_clause`
      (L3543) so a 1:N filter join doesn't multiply SELECT rows. Removing/bypassing it
      (LEFT-JOINing filter-only views into the FROM) causes fan-out double-count.
    tests: [filter_matrix, galaxy_golden]

  - id: agg_default_auto
    label: "Measure default aggregation is 'auto', never hardcoded SUM"
    scope: ["backend/app/services/semantic_query_engine.py", "backend/app/services/chart_contracts.py"]
    added_patterns: ['default.*=.*[\x27\x22]?sum', 'agg.*=.*[\x27\x22]?SUM']
    severity: medium
    message: "Default agg must resolve to 'auto' (per-type), not SUM — hardcoding SUM breaks non-additive measures."
    tests: [locked_contract, galaxy_golden]

  # GROUNDED (verified type_override_service L221; engine L1723/2519/3011).
  # Broad `SUM(` add was blind → guard the SAFE_CAST helper's presence.
  - id: safe_cast_gate_present
    label: "STRING-physical numeric columns must SAFE_CAST (Airbyte STRING → BigQuery)"
    scope: ["backend/app/services/semantic_query_engine.py", "backend/app/services/type_override_service.py"]
    removed_patterns: ['build_safe_cast_sql']
    severity: medium
    message: >
      Numeric ops over an Airbyte/STRING physical column are SAFE_CAST-ed via
      `build_safe_cast_sql` (type_override_service L221; called in engine L1723/2519/3011).
      Removing/bypassing it re-breaks SUM/AVG/compare on STRING-stored numerics on BigQuery.
    tests: [galaxy_golden, golden_sql]

  - id: symmetric_flag_default
    label: "Do not flip fan-out feature-flag defaults without a golden diff"
    scope: ["backend/app/services/semantic_query_engine.py", "backend/app/core/config.py"]
    added_patterns: ['FEATURE_SYMMETRIC_AGGREGATES.{0,14}=\s*True', 'FEATURE_PROPAGATION_ENGINE_V2.{0,14}=\s*True', 'FEATURE_SYMMETRIC_AGGREGATES[\x22\x27],\s*True', 'FEATURE_PROPAGATION_ENGINE_V2[\x22\x27],\s*True']
    severity: high
    message: >
      Flipping FEATURE_SYMMETRIC_AGGREGATES / FEATURE_PROPAGATION_ENGINE_V2 ON
      changes SQL for EVERY multi-join chart (Postgres 53× slower; BQ-only correct).
      Gate behind a per-dataset flag + golden-number diff + sign-off.
    tests: [golden_sql, galaxy_golden, symmetric_agg]

  - id: tile_fetch_seed_gate
    label: "Builder tile fetch must gate on filter-seeding (no unfiltered flash)"
    scope: ["frontend/src/components/dashboards/ChartTile.tsx"]
    removed_patterns: ['filtersReady', 'serverFilterKey\s*===\s*debouncedFilterKey']
    severity: medium
    message: >
      The tile data query is gated on `filtersReady && serverFilterKey ===
      debouncedFilterKey`. Removing it re-introduces the unfiltered wave-1 fetch
      (a flash of wrong numbers on the Builder + a wasted warehouse scan).
    tests: [tsc, browser_verify]

  - id: public_client_only
    label: "Public FE must call publicClient only (no authed calls)"
    scope: ["frontend/src/app/d/**", "frontend/src/app/embed/**"]
    added_patterns: ['\bapiClient\b', 'from\s+[\x27\x22]@/lib/api-client', 'credentials:\s*[\x27\x22]?include']
    severity: high
    message: >
      A public link page must use publicClient ONLY. An authed client call 401s
      a logged-out viewer → login redirect. Test logged-out.
    tests: [browser_verify]

  - id: scope_bound_no_leak
    label: "Filter scope bound must intersect (no escape/leak)"
    scope: ["backend/app/api/public.py", "frontend/src/lib/filters.ts"]
    removed_patterns: ['applyScopeBound', 'link_entry_has_value', 'link_locked', 'dashboard_filters_locked']
    severity: high
    message: "Removing the scope-bound intersect lets a viewer escape a locked filter (data leak)."
    tests: [layered_merge, galaxy_golden]

  # GROUNDED (verified filters.ts resolveEffectiveFilterSet + page.tsx distinct
  # context 2026-07). Guards chart↔dropdown parity — the dropdown cascade must
  # collapse same-field filters the SAME way the chart-data path does.
  - id: distinct_context_same_field_resolved
    label: "Distinct-cascade context must be same-field-resolved like chart-data (chart↔dropdown parity)"
    scope: ["frontend/src/lib/filters.ts", "frontend/src/app/(main)/dashboards/[id]/page.tsx"]
    removed_patterns: ['resolveEffectiveFilterSet', 'getDistinctValueFilterContext\(resolvedContextFilters']
    added_patterns: ['getDistinctValueFilterContext\(combinedFilters']
    severity: high
    message: >
      The dropdown distinct-value cascade MUST collapse same-field filters the
      SAME way the chart-data path does — BOTH go through `resolveEffectiveFilterSet`
      (lib/filters), which dedupes a same-field visible-default + slicer to ONE
      value (active slicer wins) + `applyScopeBound` for locked/page hard-bounds.
      Feeding the RAW union (`getDistinctValueFilterContext(combinedFilters, …)`)
      re-creates the chart↔dropdown divergence: two same-field selections get
      ANDed (`Trung_tam=RC02 AND Trung_tam=PKD4.1`) → every OTHER dropdown empties
      while the charts still show the slicer's value. Keep the distinct context on
      the resolved set. See `dashboard_filter_dual_path`. Note the public path
      (`use-public-filter-distinct-values.ts`) must stay consistent too — its
      chart data is BE-merged, so its dropdown cascade must match that winner.
    tests: [tsc, browser_verify, galaxy_golden]

  - id: fe_be_limit_pair
    label: "Raising a FE numeric limit needs a matching BE Pydantic Field(le=)"
    scope: ["frontend/src/components/dashboards/**", "frontend/src/lib/**"]
    added_patterns: ['(limit|max|Limit|Max)\s*[:=]\s*\d{3,}']
    severity: low
    message: "A raised FE numeric bound without a lock-step BE `Field(le=)` → 422 at runtime. Pair them."
    tests: [tsc]

  - id: calendar_no_parse_date_on_date
    label: "No PARSE_DATE on an already-DATE/INT column (BigQuery 400)"
    scope: ["backend/app/services/dataset_calendar_service.py", "backend/app/services/semantic_query_engine.py"]
    added_patterns: ['PARSE_DATE']
    severity: medium
    message: "PARSE_DATE on a column already DATE/INT is a BQ 400. CAST instead; verify the source column's physical type."
    tests: [galaxy_golden, golden_sql]

  - id: model_autojoin_pk
    label: "Generate-Model join must resolve the real FK, not hardcode 'id'"
    scope: ["backend/app/services/semantic_join_resolver.py", "backend/app/services/dataset_model_service.py"]
    added_patterns: ['to_column\s*=\s*[\x27\x22]id[\x27\x22]', 'join.*[\x27\x22]id[\x27\x22]']
    severity: low
    message: "Hardcoding join target 'id' breaks entities keyed on <entity>_id. Resolve the heuristic target column."
    tests: [galaxy_golden, relationship_metadata]

# ─────────────────────────────────────────────────────────────────────────────
# 5b. SEMANTIC CONTRACT — the backbone inventory. verify_semantic_contract()
#     reads the CURRENT code and asserts every file + symbol below still EXISTS
#     (a removed/renamed symbol = DRIFT — a backbone guard changed), AND flags
#     any NEW service matching semantic_file_globs that is NOT registered here
#     (an unregistered semantic file = the contract drifting out of coverage).
#     All symbols were verified present at authoring time via CodeGraph/Serena.
# ─────────────────────────────────────────────────────────────────────────────
semantic_contract:
  semantic_file_globs:
    - "backend/app/services/semantic_*.py"
    - "backend/app/services/dataset_model_service.py"
    - "backend/app/services/dataset_calendar_service.py"
    - "backend/app/services/filter_propagation.py"
    - "backend/app/services/type_override_service.py"
    - "backend/app/services/chart_contracts.py"
    - "backend/app/services/chart_semantic_service.py"
    - "backend/app/services/relationship_key_guard.py"
    - "backend/app/services/semantic_arithmetic.py"
    - "backend/app/services/execution_plan.py"
  files:
    backend/app/services/semantic_query_engine.py:
      symbols: [SemanticQueryEngine, generate_sql, _render_measure, _build_filter_exists_clause, _render_symmetric_aggregate, _build_isolated_measure_subquery, _build_dimensioned_multifact_sql, _validate_group_grain, _coerce_typed_filter_value, _filter_type_family, _render_dimension_with_time_grain, _filter_targets_measure, _aggregate_predicate, _best_calendar_dim_candidates, _collapse_fanned_calendar_filters, _view_is_generated_calendar, _record_key_probe, key_probes, _filter_route_resolver, _calendar_tie, _rebind_calendar_filters, _fact_own_calendar_view, _build_order_by_clause, _pick_route, _resolver_rooted]
    backend/app/services/dataset_model_service.py:
      symbols: [get_distinct_field_values, _build_distinct_sql, _emit_exists_for_single_path, _build_exists_for_path, _distinct_filter_targets_self, validate_direct_explore_joins, dangling_model_references, lock_dataset_model_for_write, cache_column_names, add_join, remove_join, _remove_replaced_relationship, _tombstone_auto_key_joins, replace_explore_joins]
    backend/app/services/semantic_join_resolver.py:
      symbols: [SemanticJoinResolver, resolve_path, resolve_paths, resolve_unique_path, distinct_routes, AmbiguousJoinPathError, canonical_cardinality, JoinContract, read_join_contract, join_is_usable, raise_for_invalid_relationships, SemanticRefusal, edge_propagates, forward_routes, RouteEnumerationIncomplete, _route_search, descend_ascend_routes, any_routes, shortest_propagation_routes, route_key_mapping, route_meaning_segments]
    backend/app/services/dataset_calendar_service.py:
      symbols: [build_calendar_live_sql, is_generated_calendar_table, local_date_sql, is_instant_column]
    backend/app/services/type_override_service.py:
      symbols: [build_safe_cast_sql]
    backend/app/services/filter_propagation.py:
      symbols: [resolve_filter_propagation]
    backend/app/services/chart_service.py:
      symbols: [_build_live_relation_for_semantic_view, _render_step_join_condition, _semantic_view_has_field, _wrap_live_sql_relation, _semantic_definition_signature, _build_live_semi_join, _rehydrate_binding_for_modeled_table, _adapt_live_sql_for_semantic_filters, _record_unapplied_live_filter, _record_unrenderable_live_filter, _refuse_unrenderable_live_filter, _build_semantic_alias_map, remap_semantic_engine_rows, refusal_category, _apply_role_overrides, _view_is_in_model]
    backend/app/services/chart_semantic_service.py:
      symbols: [resolve_chart_semantic_binding, with_chart_semantic_binding]
    backend/app/services/semantic_query_compiler.py:
      symbols: []   # entry module registered; no pinned symbols yet (add when known)
    backend/app/services/semantic_health_service.py:
      symbols: [evaluate, uniqueness_checks, publish_blockers, snapshot_parity_checks, invalid_relationship_checks, _relation_for_generation]
    backend/app/services/relationship_key_guard.py:
      symbols: [key_probe_sql, verify_key_probes, one_side_key, one_side_probe, statement_key_guard]
    backend/app/services/chart_contracts.py:
      symbols: [normalize_filter_conditions, normalize_filter_operator, AuthoritativeFilterNotApplied, refuse_unapplied_authoritative]
    backend/app/services/semantic_arithmetic.py:
      symbols: [normalize_division, true_division_sql]
    backend/app/services/execution_plan.py:
      symbols: [plan_chart_execution, refuse_foreign_live_sources]

# ─────────────────────────────────────────────────────────────────────────────
# 6. PATCH-LEVEL POLICY — cross-cutting checks in validate_patch / explain_risk.
# ─────────────────────────────────────────────────────────────────────────────
policy:
  # UNKNOWN IS NOT UNIFORMLY RISKY, AND TREATING IT THAT WAY GETS THE GATE TURNED OFF.
  #
  # An unmapped docs or fixture path is noise. An unmapped path under runtime code or
  # under the protection system is the case that matters: an agent inventing a new
  # module the rule engine has never heard of, merged green because "no rule covers
  # it" was rendered as an annotation. Coverage must be extended, not bypassed.
  #
  # A changed file that matches one of these globs AND classifies to no layer makes
  # the server gate FAIL. Everything else stays a warning.
  unknown_policy:
    blocking_globs:
      - "backend/app/**"
      - "backend/alembic/**"
      - "frontend/src/**"
      - "scripts/ci/**"
      - "scripts/guardrail/**"
      - ".github/workflows/**"
      - ".githooks/**"
      - ".claude/**"
      - "AGENTS.md"
      - "backend/tests/**"
      - "e2e/tests/**"
      - "qa/**"
      - "backend/scripts/golden/**"
    note: >
      Fix by teaching the rule base what the new path is (a `layers` entry, and a
      feature or protected subsystem if it deserves one) - not by deleting the path
      from this list.
  commit_only_runtime:
    # These paths are NOT runtime app code — flag if a "fix"/commit is ONLY here
    # (or MUST NOT be committed as product code).
    non_runtime_globs: ["backend/scripts/**", "DA-Test/**", "**/*.spec.ts", "scratchpad/**", "scripts/guardrail/**", "**/seed_*.py", "**/verify_*.py"]
    note: "Commits should carry runtime code (backend/app, frontend/src, deps). Test/seed/QA/docs are not runtime."
  high_blast_files:
    # Touching these is inherently high-risk regardless of the diff content.
    globs:
      - backend/app/services/semantic_query_engine.py
      - backend/app/services/dataset_model_service.py
      - backend/app/services/semantic_join_resolver.py
      - backend/app/core/config.py
      - backend/app/core/dependencies.py
  dialect_blindness:
    note: >
      Any SQL-generation change must be validated on the ACTUAL warehouse dialect
      (BigQuery), not only local Postgres — PG hides correlated-subquery + implicit-cast
      failures that BQ rejects hard. Prefer a dialect-structural check.
