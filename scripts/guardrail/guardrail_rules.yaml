    locks: "semantic kernel (Pair 1 + 2 + 3 as one contract, docs/features/semantic-foundation-freeze/kernel-contract-v1.md): division in every semantic expression (formula, nested formula, row-level measure, where_sql, dimension, % of total) is true division with a NULL zero denominator, executed on Postgres and DuckDB and through a saved chart (int/int, int/decimal, decimal/int, SUM/COUNT, negative, NULL numerator / denominator, a 1-in-30000 ratio to 1e-9, AVG of 0/1 flags); a formula over a measure of ANOTHER view is refused (UNSUPPORTED_CONTEXT), never aggregated at the formula view's grain; the same request through chart saved / preview, /semantic/query, dataset execute and measure preview gives the same rows or the same refusal category (NULL contract, a one-to-one relationship, an invalid relationship INVALID_RELATIONSHIP and a non-unique one side FANOUT_RISK included); a reused and a fresh engine compile the same meaning; a declared soft drop is reported by every entry point (dropped_filters); one live statement never reads another connection's table through its own (refused on every executor), a second connection onto the same database / schema is one connection, BigQuery physical tables (absolute names) may cross connections but custom-SQL tables of another project may not, the connection check runs before any key probe on every entry point (the live filter adapter included); a dataset-scope measure never joins a 1:N child (FANOUT_RISK) and a cross-table measure answers or refuses like the plain measure of its fact; a formula is never re-aggregated by an explicit agg or a pivot; a text operator on a date column is refused; dataset execute AND-s every predicate of a field; a cache hit keeps the engine's own dropped filters and a fanned Date filter never shares a cache slot with look-alike role filters; an isolated measure records the filter its fact cannot reach; the division rewrite never appends to a `--` / `#` comment and lexes strings per dialect"
