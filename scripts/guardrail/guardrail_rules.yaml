# AppBI Engineering Guardrail — rule base (the SINGLE source of truth).
#
# The MCP is READ-ONLY and rule-driven: it answers ONLY from what is encoded
# here. Anything not covered returns UNKNOWN (never a guessed rule). To teach
# the guardrail a new rule, add it here — do NOT hardcode rules in the Python.
#
# Rules are DERIVED from the real repo layout + DA-Test/Regression-Catalog.md +
# the project memory. Keep them factual; if unsure, omit (→ UNKNOWN) rather than
# invent.
version: 2
repo_root_markers: ["backend/app", "frontend/src"]

# ─────────────────────────────────────────────────────────────────────────────
# 1. LAYERS — each file belongs to exactly one layer (first matching glob wins,
#    order matters). `may_depend_on` lists the layers it is ALLOWED to import.
#    An import into a layer NOT listed = architecture violation. A file matching
#    no layer = UNKNOWN (not a violation — we don't guess).
# ─────────────────────────────────────────────────────────────────────────────
layers:
  - id: be_main
    match: ["backend/app/main.py", "backend/app/__init__.py"]
    label: "Backend entrypoint / app wiring"
    may_depend_on: ["*"]           # composition root may wire everything

  # TESTS ARE A LAYER TOO, and saying so is what stops every new spec from
  # blocking. `e2e/tests/**` and `backend/tests/**` are both on
  # `policy.unknown_policy.blocking_globs` — deliberately, because an unmapped
  # file there is usually a new surface nobody classified. But NO layer claimed
  # them, so `classify_file` returned None for every test file and an uncommitted
  # new spec blocked the gate until it was committed, which is the wrong moment
  # to find out. Declaring the layer is the remedy the policy note itself names;
  # widening `blocking_globs` would have been the one it forbids.
  #
  # `may_depend_on: ["*"]` because a test exists to reach across layers: that is
  # what makes it a test and not another module.
  - id: tests
    match: ["backend/tests/**", "e2e/tests/**", "qa/**", "scripts/ci/test_*.py"]
    label: "Tests (backend suites, Playwright specs, QA harnesses)"
    may_depend_on: ["*"]

  - id: be_core
    match: ["backend/app/core/**"]
    label: "Backend core (config, database, dependencies, crypto)"
    may_depend_on: ["be_core"]     # leaf: no api/services/models/modules

  # Schema migrations. Unclassified, every new migration blocked the server gate
  # as UNKNOWN (backend/alembic/** is a blocking glob) - which taught nothing and
  # stopped legitimate additive changes. Classified here AND bound to the
  # schema_migrations feature below, so a migration always requires the chain
  # check: classification must not become a quieter way to skip review.
  - id: migrations
    match: ["backend/alembic/**"]
    label: "Alembic schema migrations"
    may_depend_on: ["be_core", "be_models", "migrations"]

  - id: be_models
    match: ["backend/app/models/**"]
    label: "Backend models (SQLAlchemy ORM)"
    may_depend_on: ["be_core", "be_models"]   # NOT services/api (would invert layering)

  # MIGRATIONS WERE ON `blocking_globs` WITH NO LAYER, so every new revision made
  # the server gate fail as "unmapped" — found adding 20260925_0001 (Skill child
  # runs). Declared, as the policy note says, rather than dropping the glob. A
  # revision talks to SQLAlchemy/Alembic and at most the models it migrates;
  # reaching into services or the API from a migration is the inversion this
  # layer exists to catch. The migration RULES (single head, additive, no
  # privileged statements) stay where they are: `alembic_chain.py` and
  # `.claude/rules/database-migrations.md`.
  - id: be_migrations
    match: ["backend/alembic/**"]
    label: "Backend Alembic migrations"
    may_depend_on: ["be_core", "be_models"]

  - id: be_schemas
    match: ["backend/app/schemas/**"]
    label: "Backend Pydantic schemas"
    may_depend_on: ["be_core", "be_models", "be_schemas"]

  - id: be_services
    match: ["backend/app/services/**"]
    label: "Backend services (business logic; incl. the semantic layer)"
    may_depend_on: ["be_core", "be_models", "be_schemas", "be_services"]  # NOT api/modules

  - id: be_modules
    match: ["backend/app/modules/**"]
    label: "Backend feature modules (workboards, metadata_catalog)"
    may_depend_on: ["be_core", "be_models", "be_schemas", "be_services", "be_modules"]

  - id: be_api
    match: ["backend/app/api/**", "backend/app/routers/**"]
    label: "Backend HTTP routers (FastAPI)"
    may_depend_on: ["be_core", "be_models", "be_schemas", "be_services", "be_modules", "be_api"]

  - id: be_scripts
    match: ["backend/scripts/**", "backend/app/scripts/**"]
    label: "Backend scripts / QA harnesses (NOT runtime; not committed as app code)"
    may_depend_on: ["*"]

  - id: repo_infra
    match: ["scripts/ci/**", "scripts/guardrail/**", "scripts/cert/**",
            ".github/**", ".githooks/**",
            ".claude/**", "AGENTS.md"]
    label: "Engineering infrastructure (gates, rule base, agent contract, CI)"
    # Tooling legitimately reads every layer; the risk here is not import
    # direction, it is the gates being weakened. That is what `protected:
    # engineering_infrastructure` and check_protection_integrity.py cover.
    may_depend_on: ["*"]

  - id: fe_lib
    match: ["frontend/src/lib/**"]
    label: "Frontend lib (api clients, filters, utils)"
    # fe_types is a dependency-free CONTRACTS LEAF (it may_depend_on only itself),
    # so every layer — including lib utils — may import shared types from it.
    # (fe_stores/hooks/components/pages already allow it; fe_lib was the lone gap,
    # which false-flagged any util that imports an interface from @/types/*.)
    may_depend_on: ["fe_lib", "fe_types"]

  - id: fe_types
    match: ["frontend/src/types/**"]
    label: "Frontend shared types"
    may_depend_on: ["fe_types"]

  # THE MESSAGE CATALOGS, which no layer described.
  #
  # Found by the PR gate, which is the first thing on this branch to run
  # `--diff --base ...` across the whole range: `frontend/src/i18n/catalog/
  # agent-flows.ts` sits on `policy.unknown_policy.blocking_globs`, matched no
  # layer, and the guardrail exited BLOCK. Its own message named the remedy —
  # teach the rule base what these are, and do NOT widen `blocking_globs` to
  # make it pass.
  #
  # A catalog is a CONTRACTS LEAF like `fe_types`: every file here is a literal
  # map of keys to strings, importing only the `ModuleCatalog` type from its own
  # index. Nothing else may be imported into it, which is what keeps a
  # translation from acquiring behaviour.
  - id: fe_i18n
    match: ["frontend/src/i18n/**"]
    label: "Frontend message catalogs (i18n)"
    may_depend_on: ["fe_i18n", "fe_types"]

  - id: fe_stores
    match: ["frontend/src/stores/**", "frontend/src/providers/**"]
    label: "Frontend stores / providers"
    may_depend_on: ["fe_lib", "fe_types", "fe_stores"]

  - id: fe_hooks
    match: ["frontend/src/hooks/**"]
    label: "Frontend hooks"
    may_depend_on: ["fe_lib", "fe_types", "fe_stores", "fe_hooks"]

  - id: fe_components
    match: ["frontend/src/components/**"]
    label: "Frontend components"
    may_depend_on: ["fe_lib", "fe_types", "fe_stores", "fe_hooks", "fe_components"]

  - id: fe_pages
    match: ["frontend/src/app/**", "frontend/src/middleware.ts"]
    label: "Frontend pages (Next app router)"
    may_depend_on: ["fe_lib", "fe_types", "fe_stores", "fe_hooks", "fe_components", "fe_pages"]

# ─────────────────────────────────────────────────────────────────────────────
# 2. PROTECTED SUBSYSTEMS — high blast-radius; the AI must NOT replace/rewrite,
#    only surgically fix. Changes REQUIRE the listed gates.
# ─────────────────────────────────────────────────────────────────────────────
protected:
  - id: semantic_layer
    label: "Semantic layer (query engine + model + joins + calendar + filters)"
    files:
      - backend/app/services/semantic_query_engine.py
      - backend/app/services/semantic_query_compiler.py
      - backend/app/services/semantic_join_resolver.py
      - backend/app/services/dataset_model_service.py
      - backend/app/services/dataset_calendar_service.py
      - backend/app/services/filter_propagation.py
      - backend/app/services/type_override_service.py
      - backend/app/services/chart_contracts.py
      - backend/app/services/chart_semantic_service.py
      - backend/app/services/chart_service.py   # carries the semantic-relation helpers the distinct cascade imports
      - backend/app/services/semantic_health_service.py   # model assumptions checked on the data; gates publish
      - backend/app/services/relationship_key_guard.py    # runtime proof of every to-one key a query trusts
      - backend/app/services/semantic_arithmetic.py       # division = true division, NULL on /0, every engine
      - backend/app/services/execution_plan.py            # live / snapshot / published decision; one live statement = one connection
    directive: >
      DO NOT rewrite or replace the semantic layer. It is golden-proven
      (multi-fact fan-out, snowflake, calendar, measure isolation). Make the
      SMALLEST surgical change; never flip symmetric/propagation defaults; keep
      the SQL dialect-correct for BigQuery AND Postgres. Any change is
      behaviour-critical → run the golden gates.
    # measure_render + dialect_structural are listed FIRST because they are the
    # ones that actually run: they need no warehouse and no fixture, so they
    # execute in the unit tier on every push. golden_sql / galaxy_golden /
    # distinct_cascade_bq remain declared (`status: missing`) — they describe the
    # coverage this subsystem should have, and their absence is reported by
    # `guardrail_check.py --health` rather than hidden.
    required_tests: [measure_render, dialect_structural, semantic_state_contracts, filter_matrix,
                     golden_sql, galaxy_golden, distinct_cascade_bq, surface_parity,
                     relationship_contract, relationship_contract_pg, pair1_baseline_parity,
                     public_authoritative_bounds, pair2_golden_topology, pair3_chartservice,
                     chart_final_hardening, semantic_foundation, pair4_surfaces]

  - id: public_link_security
    label: "Public-link filter merge / access (data-exposure surface)"
    files:
      - backend/app/api/public.py
      - frontend/src/app/d/[token]/page.tsx
      - frontend/src/app/embed/[token]/page.tsx
      - frontend/src/lib/api/public.ts
    directive: >
      Data-exposure surface. Locked/hidden filters must stay enforced (scope
      bound, no leak). The public FE must use publicClient ONLY (no authed
      calls). Verify logged-out.
    required_tests: [layered_merge, galaxy_golden, public_authoritative_bounds, public_authoritative_bounds_pg,
                     pair4_surfaces]

  - id: engineering_infrastructure
    label: "The protection system itself (gates, rule base, agent contract, CI)"
    files:
      - scripts/ci/verify.py
      - scripts/ci/guardrail_check.py
      - scripts/ci/check_claude_config.py
      - scripts/ci/check_protection_integrity.py
      - scripts/ci/check_agent_config.py
      - scripts/ci/preflight.sh
      - scripts/guardrail/guardrail_core.py
      - scripts/guardrail/guardrail_rules.yaml
      - .githooks/pre-push
      - .claude/settings.json
      - .claude/hooks/stop_gate.py
      - .claude/hooks/post_edit_fast.py
      - AGENTS.md
      - .claude/CLAUDE.md
    directive: >
      These files decide whether anything else is allowed to ship. An agent must
      not weaken them to make its own change pass. Deleting a protected
      subsystem, an invariant or a required gate, downgrading a runnable gate to
      missing/untracked/manual, removing a verification step, or making the Stop
      gate fail-open are all treated as weakening. Changes here are legitimate,
      but they must be deliberate, declared, and reviewed - never a side effect
      of an unrelated task. The trusted BASE copy of
      check_protection_integrity.py inspects base..head, so editing the checker
      in the same PR does not disable it.
    required_tests: [agent_sdlc_meta, stop_gate_decision, guardrail_diff_range,
                     protection_approval_is_one_commit, product_gate_is_a_real_boundary,
                     product_gate_root_of_trust]

# ─────────────────────────────────────────────────────────────────────────────
# 3. FEATURES — impact map. A changed file that owns a feature drags in that
#    feature's invariants + required tests. `keywords` help match a fix
#    description (validate_fix_plan) to the right owner files.
# ─────────────────────────────────────────────────────────────────────────────
features:
  - id: schema_migrations
    label: "Alembic schema migrations (single head, parent committed, additive)"
    files: ["backend/alembic/**"]
    keywords: [migration, alembic, "down_revision", "schema change"]
    required_tests: [alembic_chain]

  - id: distinct_value_cascade
    label: "Slicer/filter dropdown distinct-value cascade"
    files: [backend/app/services/dataset_model_service.py, backend/app/api/public.py]
    keywords: [distinct, dropdown, slicer, cascade, "khong ra gia tri", "không ra giá trị", "filter value", "loading values"]
    invariants: [distinct_no_correlated_bq, distinct_no_or_of_ins, distinct_no_in_over_aggregated, distinct_strict_no_showall, distinct_self_exclude]
    required_tests: [distinct_cascade_bq, galaxy_golden, pair4_surfaces]

  - id: chart_sql_engine
    label: "Chart SQL generation (semantic query engine)"
    files: [backend/app/services/semantic_query_engine.py, backend/app/services/semantic_query_compiler.py]
    keywords: [measure, aggregate, group by, sql, fan-out, fanout, "sai so", "double count", grain, having]
    invariants: [fanout_exists_not_join, agg_default_auto, sum_over_string_gate, symmetric_flag_default]
    required_tests: [golden_sql, galaxy_golden, measure_render, filter_matrix]

  - id: join_resolution
    label: "Semantic join resolver (multi-hop, cardinality, role-play, chasm)"
    files: [backend/app/services/semantic_join_resolver.py]
    keywords: [join, joins, joined, relationship, cardinality, snowflake, "many_to_one", chasm, "fan out"]
    invariants: [model_autojoin_pk]
    required_tests: [galaxy_golden, filter_matrix, relationship_metadata, relationship_contract]

  - id: relationship_authoring
    label: "Relationship authoring ↔ join resolver (one authored relationship = one persisted = one runtime contract)"
    files:
      - backend/app/services/dataset_model_service.py
      - backend/app/services/relationship_key_guard.py
      - backend/app/routers/semantic.py
      - frontend/src/components/datasets/DataModelCanvas.tsx
      - frontend/src/hooks/use-dataset-model.ts
    keywords: [relationship, "add_join", "remove_join", "primary key", "cross_filter", "is_active", alias, tombstone, regenerate, "edit relationship"]
    required_tests: [relationship_contract, relationship_contract_pg, semantic_router_access]

  - id: calendar_time
    label: "Calendar / time dimension (generated calendar, role-play, grain)"
    files: [backend/app/services/dataset_calendar_service.py]
    keywords: [calendar, date dim, time grain, month, quarter, "date_dim", role-play, "parse_date", timezone]
    invariants: [calendar_no_parse_date_on_date]
    required_tests: [galaxy_golden, filter_matrix]

  - id: filter_layered_merge
    label: "Public/dashboard filter layered merge + scope bound"
    files: [backend/app/api/public.py, frontend/src/lib/filters.ts]
    keywords: [locked, hidden, "public filter", "scope bound", layered, leak, viewer]
    invariants: [public_client_only, scope_bound_no_leak]
    required_tests: [layered_merge, galaxy_golden, public_authoritative_bounds, public_authoritative_bounds_pg,
                     pair4_surfaces]

  - id: dataset_publish_gate
    label: "Sync & Publish gate — the candidate generation is the artifact validated"
    files:
      - backend/app/services/dataset_publish_service.py
      - backend/app/services/semantic_health_service.py
    keywords: [publish, generation, snapshot, "semantic health", candidate, "sync & publish"]
    required_tests: [publish_candidate_generation, semantic_health, pair5_data_state]

  - id: data_state
    label: "Source / data prep / snapshot <-> drift / health / quality / observability (Pair #5)"
    files:
      - backend/app/services/transformation_compiler.py
      - backend/app/services/live_query_service.py
      - backend/app/services/snapshot_service.py
      - backend/app/services/snapshot_scheduler.py
      - backend/app/services/dataset_relation_service.py
      - backend/app/services/dataset_quality_service.py
      - backend/app/services/observability_service.py
      - backend/app/services/dataset_crud.py
      - backend/app/services/dataset_composition_service.py
      - backend/app/services/column_summary_service.py
      - backend/app/services/description_pipeline_service.py
      - backend/app/api/observability.py
    keywords: [transformation, "calculated column", snapshot, drift, schema, quality, freshness, volume,
               observability, monitor, incident, publish]
    required_tests: [pair5_data_state]

  - id: dashboard_build_render
    label: "Dashboard Builder tile render + filter seeding (FE)"
    files:
      - frontend/src/app/(main)/dashboards/[id]/page.tsx
      - frontend/src/components/dashboards/ChartTile.tsx
      - frontend/src/components/dashboards/DashboardGrid.tsx
      # DashboardCanvas.tsx was removed (unified grid, 20260928_0001): the grid
      # is the only layout. The grid's arrange tools are the builder's now.
      - frontend/src/lib/grid-arrange.ts
    keywords: [dashboard, tile, tiles, chart render, "build screen", "khong align", "không align", flash, unfiltered, slicer default, draft, publish]
    invariants: [tile_fetch_seed_gate]
    required_tests: [tsc, browser_verify]

  - id: filter_pane_slicers
    label: "Filter pane / slicer controls on the grid (FE)"
    files:
      - frontend/src/components/dashboards/FilterPane.tsx
      # SlicerCluster.tsx was removed (20260929_0001): a report has no filter area;
      # its slicers are controls on the grid (GridSlicerTile below).
      - frontend/src/components/dashboards/DashboardFilterBar.tsx
      - frontend/src/hooks/use-public-filter-distinct-values.ts
      # Slicer controls on the grid draw the same entries through the same bar.
      - frontend/src/components/dashboards/GridSlicerTile.tsx
      - frontend/src/lib/slicer-placement.ts
      - frontend/src/lib/slicer-entry.ts
    keywords: [slicer, filter pane, "filters on this page", scope, "trang nay", distinctStatus]
    invariants: [fe_be_limit_pair]
    required_tests: [tsc, browser_verify]

  - id: semantic_direct_api
    label: "Direct semantic API (/semantic views, models, explores, query) — object-level access"
    files: [backend/app/routers/semantic.py]
    keywords: [semantic api, "/semantic", explore, "semantic query", permission, access]
    invariants: []
    required_tests: [semantic_router_access, error_contracts]

  - id: semantic_health
    label: "Semantic health (key uniqueness / dangling refs / snapshot parity) + publish gate"
    files: [backend/app/services/semantic_health_service.py, backend/app/services/dataset_publish_service.py]
    keywords: [quality, health, uniqueness, "primary key", cardinality, publish, snapshot parity]
    invariants: []
    required_tests: [semantic_health, pair5_data_state]

  - id: measures
    label: "Measures (expression/filters/ratio/context modifiers)"
    files: [backend/app/services/semantic_query_engine.py]
    keywords: [measure, ratio, "count distinct", "percent of total", "filtered measure", "where_sql", "depends_on"]
    invariants: [agg_default_auto, sum_over_string_gate]
    required_tests: [measure_render, galaxy_golden, golden_sql]

  - id: auth_permissions
    label: "Auth / permissions"
    files: [backend/app/api/auth.py, backend/app/api/permissions.py, backend/app/core/dependencies.py, frontend/src/lib/auth.ts, frontend/src/hooks/use-permissions.ts]
    keywords: [auth, authentication, authorization, login, "sign in", token, tokens,
               permission, permissions, role, roles, jwt, "access control", session]
    invariants: []
    required_tests: [import_smoke]

  - id: workboards
    label: "Workboards (mini-app) module"
    files: [backend/app/modules/workboards/**]
    keywords: [workboard, workboards, screen, screens, mini-app, "form", "forms",
               "RLS", "workspace", "cong"]
    invariants: []
    required_tests: [import_smoke]

  - id: metadata_catalog
    label: "Governance / Observability (metadata catalog) module"
    files: [backend/app/modules/metadata_catalog/**]
    keywords: [govern, catalog, observability, lineage, monitor, incident, metric]
    invariants: []
    required_tests: [import_smoke]


  - id: agent_flows
    label: "Agent Flow Studio (authoring + runtime + node model)"
    files:
      - backend/app/services/agent_flows/**
      - backend/app/modules/agent_flows/api.py
      # AI Keys: the stored provider credentials every model step runs on
      # (services/agent_flows/credentials.py is already covered by the glob above).
      - backend/app/modules/agent_flows/credentials_api.py
      - backend/app/models/ai_provider_credential.py
      - frontend/src/lib/agentFlows.ts
      - frontend/src/components/agent-flows/**
      # The ONE answer renderer, shared by the Studio test panel, the dashboard
      # component chat, the public bot and Direct Chat. It sits under dashboards/
      # for historical reasons and so matched no feature at all: editing the
      # component four surfaces render through resolved `tsc` and nothing else.
      # The parity INVARIANT still fired (it matches diff content, not paths) —
      # what was missing is the required-test set, which is path-matched.
      - frontend/src/components/dashboards/AnswerBlocks.tsx
      # THE TOOL BODIES THEMSELVES, which do not live under `agent_flows/`.
      #
      # `tools/packs/_source.py` is an explicit seam: the packs DECLARE what a
      # tool is — name, cost, result kind, what it returns — while the body is
      # still imported from `dashboard_ai_bot`, because that data path carries
      # dozens of hard-won corrections and rewriting it from a clean sheet means
      # finding those failures again in production.
      #
      # The seam was never reflected here, so the file that produces every
      # analytical number in the product could be edited while the guardrail
      # reported `ok`, 0 features touched and 0 required tests. Measured on all
      # six of these files before this entry existed. `unknown` is not `safe`,
      # and the same shape is already documented above for AnswerBlocks.tsx.
      #
      # Scoped to the ANALYTICAL SURFACE and no wider: the tool bodies, the data
      # path every tool reads through, the governed scope/semantic helpers, the
      # figure verifier and the external tool body. Deliberately NOT included —
      # `events.py` (an event dataclass), `providers/**` (LLM adapters),
      # `guard.py`, `prompts.py`, `govern_doc_*` — those are runtime support, and
      # claiming them would make Agent Flow the owner of code it only consumes.
      - backend/app/services/dashboard_ai_bot/thinking/tools.py
      - backend/app/services/dashboard_ai_bot/thinking/advanced_tools.py
      - backend/app/services/dashboard_ai_bot/tool_context.py
      - backend/app/services/dashboard_ai_bot/govern_tools.py
      - backend/app/services/dashboard_ai_bot/verifier.py
      - backend/app/services/dashboard_ai_bot/web_search.py
      # Found by the computed invariant in `scripts/ci/test_tool_bodies_are_guarded.py` on its
      # first run — `recall_knowledge` lives here, and a hand-written list had missed it.
      - backend/app/services/dashboard_ai_bot/knowledge.py
      # THE CERTIFICATION SOURCE OF TRUTH.
      #
      # `scripts/cert/tool_certification.yaml` decides whether a tool counts as
      # semantically VERIFIED. A file with that authority must not be editable
      # without the gate that checks it: before this entry it matched no feature,
      # so downgrading a tier or deleting an oracle reference pulled in no test
      # at all. Listing it here makes `agent_flow_container` (which carries
      # `test_tool_certification_matrix.py`) and `tier1_oracles_execute`
      # required on any change to it.
      - scripts/cert/**
    # Whole-word matched (guardrail_core._keyword_pattern). "flow" alone is far too
    # common in this repo to be a signal, so the phrases carry the weight.
    keywords: ["agent flow", "agent flows", agentflow, brain, brains, brain_key,
               "node topology", "node registry", nodespec, "child slot", "child slots",
               coordinator, "coordinate node", specialist, specialists,
               "switch branch", "flow canvas", "node inspector", "flow builder",
               "answer envelope", "answer block", "answer blocks", "flow runtime",
               executor, run_flow, "tool node", report_read]
    invariants: [agent_flow_container_topology, agent_flow_answer_parity]
    required_tests: [agent_flow_contract, agent_flow_replay, agent_flow_container,
                     agent_flow_surface, agent_flow_evidence, tier1_oracles_execute,
                     agent_flow_credentials]

  - id: direct_chat
    label: "Direct Chat (reader surface of Agent Flow)"
    files:
      - backend/app/services/agent_flows/direct_chat.py
      - backend/app/modules/agent_flows/chat_api.py
      - frontend/src/lib/directChat.ts
      - frontend/src/components/chat/**
      # Chat renders its answers through the shared component too — see the note
      # on the same path under `agent_flows`.
      - frontend/src/components/dashboards/AnswerBlocks.tsx
    keywords: ["direct chat", "ai chat", "chat thread", "chat threads", assistant,
               assistants, conversation, conversations, "thread access",
               "thread sharing", "chat surface", "chat brain", "chat brains"]
    invariants: [agent_flow_answer_parity]
    required_tests: [direct_chat_contract, direct_chat_module_floor]

# ─────────────────────────────────────────────────────────────────────────────
# 4. TESTS REGISTRY — from DA-Test/Regression-Catalog.md §1. `run` is the exact
#    command; `locks` is what a green run guarantees.
# ─────────────────────────────────────────────────────────────────────────────
tests:
  # ── Agent Flow / Direct Chat ────────────────────────────────────────────────
  # Registered 2026-09-15. Twelve suites in this area were committed with
  # `git add -f` but never allow-listed and never referenced by a workflow, so they
  # passed locally and ran nowhere. `scripts/ci/audit_test_reachability.py` is the
  # inventory that found them.
  agent_flow_contract:
    run: "pytest backend/tests/test_agent_flow_answer_contract.py backend/tests/test_agent_tool_registry.py backend/tests/test_tool_output_contract.py"
    locks: "the flow contract, the tool registry and the answer envelope shape"
  # REGISTERED 2026-09-20, after a red CI that a green `verify.py task` could not
  # have predicted. These 20 suites were run by the workflow and named by NO gate,
  # so the canonical Definition-of-Done command could not run them: the local gate
  # and the CI gate were checking differently-shaped sets. Classified by IMPORT
  # (they import app.services.agent_flows), not by filename.
  # ADOPTED 2026-09-20 by dependency tracing, not by filename. Both were committed
  # and referenced by no runner, and both guard something Waves 1-2 stand on.
  agent_flow_credentials:
    run: "pytest backend/tests/test_ai_provider_credentials.py backend/tests/test_ai_credential_providers.py backend/tests/test_node_registry_first_load_race.py"
    locks: "a model step runs only on its own stored AI key: encrypted or refused, never returned by any API, assigned only by someone who may use it, re-checked against its grantor on every run, no fallback to the link / viewer / server key; each vendor dispatches to an adapter that keeps its tools; the node registry survives parallel first use"
  agent_flow_evidence:
    run: "pytest backend/tests/test_verifier_false_alarms.py"
    locks: "the number verifier Agent Flow's evidence check calls at executor.py:1094 and agent.py:629 — a false alarm there re-flags correct answers, a missed one lets an invented figure through"
  direct_chat_module_floor:
    run: "pytest backend/tests/test_module_floor.py"
    # Asserts every authed route refuses a caller holding nothing, by WALKING the
    # route table. FastAPI >= 0.110 defers router inclusion, so on a machine whose
    # FastAPI is newer than the pinned 0.109.0 the walk sees one route and the
    # suite fails for an environment reason. CI installs the pin and runs it for
    # real; `requires` makes that state explicit instead of a false red locally.
    requires: pinned-fastapi
    locks: "module_floor('chat') actually gating the Direct Chat router"

  agent_flow_surface:
    run: "pytest backend/tests/test_agent_flow_golden.py backend/tests/test_builder_error_messages.py backend/tests/test_chart_discovery_and_figure_correction.py backend/tests/test_chart_read_failure_reason.py backend/tests/test_discover_pack.py backend/tests/test_error_taxonomy_and_empty.py backend/tests/test_flow_attached_but_unreadable.py backend/tests/test_followup_and_freshness.py backend/tests/test_govern_doc_citation.py backend/tests/test_govern_doc_evidence_link.py backend/tests/test_govern_knowledge_tools.py backend/tests/test_i5_hard_gate_stays_lowest.py backend/tests/test_partial_context_admits_it.py backend/tests/test_report_read_scope.py backend/tests/test_tool_argument_contract.py backend/tests/test_tool_authorization_metadata.py backend/tests/test_tool_capability_gates.py backend/tests/test_tool_node.py backend/tests/test_tool_result_ceiling.py backend/tests/test_what_the_ai_sees.py"
    locks: "the wider Agent Flow surface CI already ran — tools, discovery, read failures, builder errors, knowledge citation"

  agent_flow_replay:
    run: "pytest backend/tests/test_agent_flow_replay.py"
    locks: "16 canonical fixtures replay with no semantic drift — the tripwire for any runtime or traversal change"
  agent_flow_container:
    run: "pytest backend/tests/test_coordinator_is_visible_to_the_flow.py backend/tests/test_flow_coordinate.py backend/tests/test_flow_synthesis_sees_all_steps.py backend/tests/test_flow_type.py backend/tests/test_node_child_slots.py backend/tests/test_read_status_survives_compaction.py backend/tests/test_diagnostics_tell_the_truth.py backend/tests/test_tree_validation_is_canonical.py backend/tests/test_nested_specialist_credentials.py backend/tests/test_authoring_is_strict.py backend/tests/test_asset_resolution.py backend/tests/test_context_handoff.py backend/tests/test_report_read_selection_is_explicit.py backend/tests/test_no_evidence_no_confident_number.py backend/tests/test_question_grounding.py backend/tests/test_reuse_evidence_equivalence.py backend/tests/test_time_axis_contract.py backend/tests/test_partial_period_comparison.py backend/tests/test_grant_has_a_way_in.py backend/tests/test_nonrecoverable_retry_policy.py backend/tests/test_dead_retry_costs_nothing.py backend/tests/test_dimension_is_not_a_measure.py backend/tests/test_requested_dimension_is_not_substituted.py backend/tests/test_analytical_tool_semantics.py backend/tests/test_tool_certification_matrix.py backend/tests/test_capability_serviced_the_intent.py backend/tests/test_qualifier_provenance.py backend/tests/test_eval_accounting.py backend/tests/test_eval_provenance.py backend/tests/test_cross_lingual_resolution.py"
    locks: "every container node is walked by all_nodes(); a coordinator's lane is visible to every authoring check"
  direct_chat_contract:
    run: "pytest backend/tests/test_chat_thread_sharing.py backend/tests/test_chat_chart_scope.py backend/tests/test_notice_audience_boundary.py backend/tests/test_reader_capability_boundary.py backend/tests/test_reader_diagnostics_are_product_facing.py"
    locks: "chat thread access levels, read-only shares, the chat surface's chart scope, and that a reader - including an anonymous one on a public link - is told WHY a step failed without being shown the tool id, chart id or raw column the author's trace keeps"

  # ── Provider-neutral SDLC protection layer (from demo) ──────────────────────
  agent_sdlc_meta:
    run: "pytest scripts/ci/test_agent_sdlc.py"
    locks: "provider-neutral SDLC: adapters point at one executable contract, the server-side base..head diff sees the real changed files, architecture violations fail the gate, UNKNOWN is not reported safe, infrastructure failure is not reported pass, attempts to weaken the protection system are detected, and an ordinary clean change is not blocked"
  canonical_time_semantics:
    run: "pytest backend/tests/test_canonical_time_semantics.py backend/tests/test_time_axis_needs_more_than_a_name.py backend/tests/test_time_axis_at_the_tool_boundary.py"
    locks: "ONE name-level answer to 'is this column a time axis': the segment-edge rule kills the substring bugs (`day` inside `holiday`, `nam` inside `name`), the token union keeps created_at/dt/period/quarter AND tuan/quy, the ambiguous ky_*/quy_* verdicts are pinned as decisions, and every implementation - coverage, project_ahead, advanced_tools, insight_pack - returns the same verdict for the same name; AND that a name which only SUGGESTS time (ky_*, quy_*) cannot buy a time-series calculation on its own - compare_periods, analyze_trend, forecast_measure, detect_anomaly, project_ahead and insight_pack all require value evidence before treating it as an axis; that the VALUE semantic is canonical too - advanced_tools no longer carries its own period regex - and that a MAJORITY of sampled values must read as periods, so one accidental year among categories is not a time axis; asserted at the TOOL boundary with real chart payloads, not by inspecting source"
  product_gate_root_of_trust:
    run: "pytest scripts/ci/test_product_gate_root_of_trust.py"
    locks: "the status branch protection requires is itself protection-critical, and the BASE checker verifies the head Product Gate structurally by reading it AS DATA: ten weakenings are caught - deletion, a dropped sentinel, a dropped backend/E2E/classifier dependency, a removed always-run path, skipped accepted for a relevant suite, a swallowed classification failure, success no longer required, and the gate path-filtered - while a comment, a renamed display string and reordered jobs are not"
  product_gate_is_a_real_boundary:
    run: "pytest scripts/ci/test_product_gate_is_a_real_boundary.py"
    locks: "every PR carries ONE always-present product status: the classify job maps the diff onto suites BEFORE anything runs, the heavy suites are CALLED and not copied, and the sentinel fails when a suite the diff needed concluded anything other than success - skipped included, because skipped is what a job that disappeared looks like and must never read as irrelevant"
  protection_approval_is_one_commit:
    run: "pytest scripts/ci/test_protection_approval_is_one_commit.py"
    locks: "the owner-approval hatch is a COMMIT and not a switch: unset blocks, `true`/`1`/`*`/a branch name block, the exact head SHA permits a declared removal, a later push invalidates it, and it never excuses a protected subsystem losing a required gate. Also that change-guardrail.yml exports exactly the variable the checker reads - the two disagreed, so the hatch had never opened"
  alembic_chain:
    run: "python scripts/ci/alembic_chain.py"
    locks: "one alembic head, and every down_revision a migration that exists in the tree - a missing parent crash-loops the backend at boot"
  guardrail_architecture_diff:
    run: "pytest scripts/ci/test_guardrail_architecture_diff.py"
    locks: "the architecture check judges the imports a diff ADDS: a new violating import is caught, an old one in a touched file is not charged to the change, a file absent from the diff map is still scanned whole; migrations are classified AND bound to alembic_chain; an unclassified runtime path still blocks"
  guardrail_diff_range:
    run: "pytest scripts/ci/test_guardrail_diff_range.py"
    locks: "the guardrail tells an EMPTY diff from one it could not resolve: a real zero-change range is allowed, an unresolvable base/head or a git failure returns unknown and a non-zero exit, and --json stays valid JSON in every state"
  tier1_oracles_execute:
    run: "python scripts/ci/check_tier1_oracles.py"
    locks: "every TIER-1 tool's declared semantic oracle NODE actually runs and passes — a missing, skipped, errored or failed node fails the gate, because a test file existing is not an oracle executing and `pytest.skip` on a refused valid fixture turns a product regression into a green suite"
  tool_bodies_are_guarded:
    run: "pytest scripts/ci/test_tool_bodies_are_guarded.py"
    locks: "every file defining a registered tool is claimed by a guardrail feature and pulls in at least one required test, derived from the registry rather than a list; the seam under dashboard_ai_bot is named; runtime support (events.py) is deliberately NOT claimed"
  ci_wiring_is_real:
    run: "pytest scripts/ci/test_ci_wiring_is_real.py"
    locks: "an allow-listed backend suite is actually PASSED TO PYTEST, not merely present somewhere in the workflow file: the per-line argument rule, a collapsed line continuation named with its line number, 'present mid-line' distinguished from 'absent', an allow-listed file that does not exist, and this repository's own workflow checked for the same collapse"
  stop_gate_decision:
    run: "pytest scripts/ci/test_stop_gate.py"
    locks: "Stop hook: green allows, FAILED blocks every time (including on retry), UNVERIFIED blocks once then allows, infrastructure failure never becomes green, override stays explicit"
  # Until 2026-09-30 these three (and error_contracts below) were `status: missing`
  # / `untracked`: the harnesses were never committed and only ever existed on the
  # machine that wrote them. The semantic-core remediation restored each as a
  # TRACKED suite that CI runs (backend-contract-tests.yml: integration-golden for
  # the Postgres ones, unit for error_contracts). The original harnesses targeted
  # local datasets (ds113) that no fresh clone has; the restored gates lock the
  # same risks on fixtures CI builds itself.
  distinct_cascade_bq:
    requires: postgres-fixture
    run: "pytest backend/tests/test_distinct_cascade_semijoin.py"
    locks: "slicer distinct cascade: members offered through ANY shared fact equal a truth computed from the raw fixture tables (Postgres, executed); on BigQuery the SQL is one INNER JOIN semi-join over a UNION DISTINCT key set — no correlated EXISTS, no IN (SELECT …), no OR-of-INs, backticked identifiers. BigQuery EXECUTION of that shape is verified against a real warehouse, not claimed from SQL"
  galaxy_golden:
    requires: postgres
    run: "pytest backend/tests/test_semantic_golden_matrix.py"
    locks: "semantic VALUE matrix executed on Postgres against hand-computed answers: star (NULL member, base invariance, NULL contract of negations), role-playing date x3 (a fanned Date filter collapses onto the main calendar or refuses), diamond refused and deterministic once a route is inactive, galaxy at different grains (time grain survives the calendar rebind; Top-N, sort and a measure filter apply to the stitched rows), chasm refused + shared-dim stitch, M:N bridge refused, composite key, timezone local-day agreement between time grain and calendar"
  golden_sql:
    requires: postgres-fixture
    run: "pytest backend/tests/test_golden_sql_non_regression.py"
    locks: "every saved chart of the CI snowflake fixture generates the committed SQL on Postgres AND BigQuery (BigQuery re-typed in-session with execution stubbed; a refusal is part of the baseline). Re-baseline only deliberately: GOLDEN_SQL_CAPTURE=1"
  filter_matrix:
    requires: postgres-fixture
    run: "python backend/scripts/regression_filter_matrix.py --verify --tag snowflake"
    locks: "fan-out→EXISTS, conformed-dim transitive filter, multi-hop, chasm fail-loud, cross-table measure re-anchor"
  semantic_router_access:
    run: "pytest backend/tests/test_semantic_router_object_access.py"
    locks: "SEM-P1-004: every /semantic endpoint checks access to the object's DATASET (denied: stranger read/list/write/delete/query, view-share cannot write, module view caps an owner, dataset-less object needs datasets:full; allowed: owner); joins written wholesale are validated (other dataset's view, missing column, missing or contradictory cardinality); objects cannot move across datasets; context modifiers cannot be added or changed on save (a legacy one may stay unchanged or be removed)"
  relationship_contract:
    run: "pytest backend/tests/test_relationship_contract.py"
    locks: "one reader of persisted relationships (read_join_contract) for resolver, grain graph, health, pickers and the model response: every legacy form in tests/fixtures/relationship_legacy_v1.json is SUPPORTED (explicit canonical reading) or INVALID (excluded from the graph, query refused) — unknown/missing cardinality is never many-to-one, 'false' is never active, an invalid cross_filter is never single; reverse edges keep composite keys and calendar CASTs; health reads the resolver's key; PK + relationship commit once or not at all; a 1:N drawing with a PK is refused; an identity-changing edit replaces (and tombstones an auto row); a same-identity edit keeps the stored condition and provenance; delete is alias-aware, never a wildcard; regeneration keeps user edits and never resurrects a removed auto join; the direct API stores only rows the reader accepts and keeps provenance on a round trip; the persisted JSON and the reloaded runtime graph agree after every state transition; the key probe covers every ONE side of the walked cardinality (a chart based on the dimension included, both sides of a 1:1), groups by the expressions the ON condition compares (casts included) and refuses a duplicate or an unverifiable condition; write paths read keys through the contract (composite behind a scalar shorthand, LookML twin rows); the distinct cascade refuses an invalid model; self-join aliases and expression-column agreement in the contract"
  public_authoritative_bounds:
    run: "pytest backend/tests/test_public_authoritative_bounds.py"
    locks: "a server-owned public constraint (link lock / 🚫 hidden, 🔒/🚫 dashboard filter, page scope, link scope, embed claim, workboard role) is applied or the request is refused — never skipped: two constraints on one field AND (no last-wins), a kill-marker never removes a lock, two scopes AND (no fallback widening), the central drop recorder and every engine/live/distinct drop site refuse a marked constraint, calendar rewrites accumulate instead of overwriting, an ordinary filter on an unrelated table keeps its documented soft drop, malformed 🔒/page bounds fail closed (409), the refusal names no field and no value, the result-cache key carries the semantic contract version"
  public_authoritative_bounds_pg:
    requires: postgres-fixture
    run: "pytest backend/tests/test_public_authoritative_bounds_pg.py"
    locks: "on the real public routes of the seeded fixture: a lock / 🚫 hidden constraint / page bound with no relationship path to the chart is refused (the anonymous viewer used to get the unscoped total), a related lock is applied with the hand-computed value, a dropdown under a lock it cannot apply offers nothing, a malformed 🔒 dashboard filter is 409, an ordinary dashboard filter keeps the documented unfiltered result, and a result cached for the ordinary request is never served for the authoritative one"
  publish_candidate_generation:
    run: "pytest backend/tests/test_publish_candidate_generation.py"
    locks: "Sync & Publish validates the relationship keys of the CANDIDATE generation's snapshot tables on their host (not the live source): a candidate built from duplicated data does not publish even when the live source was repaired, the previously published generation stays pinned, a clean published snapshot stays valid when the live source later decays, mixed-source tables are judged on the host, and every health result says what it checked (live_source / candidate_generation / published_generation + generation)"
  pair2_golden_topology:
    requires: postgres
    run: "pytest backend/tests/test_pair2_golden_topology_pg.py"
    locks: "resolver ↔ engine: one semantic request has one business interpretation — hand-computed values for star, snowflake, role diamond (customer+store+region refused, never the name-order pick), chasm, galaxy (a filter on another fact restricts through EVERY valid shared dimension, AND-ed, whatever the grouping; a single-direction relationship never carries a filter), three facts (a filter on one fact never leaks into another), role-playing dates (a tied date role is refused, never candidate[0]; an own-role filter keeps its role), composite key, M:N bridge, NULL keys, ties (Top-N / sort + LIMIT break ties by the group value, NULLs last); executed on Postgres and DuckDB; every case re-asked under relationship/explore/measure/dimension/filter order permutations, node-set order and a fresh graph gives the same rows or the same refusal category; a relationship edit changes the next query's route; the query plan names the strategy and the filter routes; route meanings of DIFFERENT lengths (never shortest-wins) asked from the fact and from dimension bases give the same value or the same refusal (a customers- or regions-based chart cannot resolve a meaning the sales base refuses); a route set past the planner's bounds (more than 64 routes — a 128-chain lattice, 65 filter-propagation routes — or a meaning longer than 8 hops) is refused (ROUTE_LIMIT), never truncated; chains that compose to the same key equalities are one meaning (no over-refusal); a filter on another table AND-s its most direct routes, and a shorter route a filter may not travel never hides a valid one; two date roles reached through dimensions tie whatever their depth; a measure-level filter routes from the measure's view"
  pair3_chartservice:
    requires: postgres
    run: "pytest backend/tests/test_pair3_chartservice_pg.py"
    locks: "query engine ↔ ChartService: every Pair 2 golden request through ChartService (saved chart, preview, stale/minimal/empty stored bindings, legacy config.source charts) gives the engine's rows / refusal category; a cached result never outlives a model, measure, filter, snapshot generation, security scope or host change; a live fallback after a missing snapshot is compiled for and executed on the SOURCE engine (a published snapshot never falls back); refusal categories reach the HTTP response (X-AppBI-Refusal) and the batch; a field keeps its values whatever its name's case (Postgres alias folding) and two fields reducing to one result column are refused; a what-if swap renders a declared measure by its own type; the live filter adapter keeps the engine's base rows; generated and custom query modes never stand in for each other; base AND runtime filters, never replaced; an unrelated table's filter is a recorded soft drop"
  chart_final_hardening:
    requires: postgres
    run: "pytest backend/tests/test_chart_final_hardening_pg.py"
    locks: "chart HTTP contract: a two-meaning relationship route is refused (400, X-AppBI-Refusal AMBIGUOUS_ROUTE, body refusal {category, target, routes}) identically on preview, saved chart data and Save's dry-run (runtime_refusal), deterministically; an Inactive relationship answers the hand-computed rows on preview and saved chart alike; GET /charts/{id}/data returns sql_emitted/routing/dialect only to edit/full, a view-only reader gets the public-safe subset; a non-refusal failure (preview, chart data, dry-run, batch tile) never returns raw exception text (credentials, host, dbname) but a reference id; PUT validates the MERGED chart through ChartCreate (config-only and type-only updates included, rename allowed); per-chart-type required roles are enforced (Enum value, not str(Enum)); percent_of_total saves, case-insensitive aggs, median refused and never rewritten to auto; generated mode with a leftover customSql is validated as generated"
