# Development stack for hot reload.
#
# Base dev stack:
#   docker compose -f docker-compose.dev.yml up --build -d
#
services:
  db:
    profiles: ["local-db"]
    image: pgvector/pgvector:pg16
    container_name: appbi-db-dev
    environment:
      POSTGRES_USER: ${DB_USER:-appbi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-appbi}
      POSTGRES_DB: ${DB_NAME:-appbi}
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appbi} -d ${DB_NAME:-appbi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      appbi-net:
        aliases:
          - appbi-db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: appbi-backend-dev
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - appbi_data_dev:/app/.data
    env_file:
      - .env
    environment:
      # Optional full override for external PostgreSQL (SSL params, managed URIs).
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-appbi-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-appbi}
      DB_PASSWORD: ${DB_PASSWORD:-appbi}
      DB_NAME: ${DB_NAME:-appbi}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
      LOG_LEVEL: DEBUG
      SECRET_KEY: dev-secret-key
      ENVIRONMENT: dev
      COOKIE_SECURE: "false"
      AUTH_PASSWORD_LOGIN_ENABLED: ${AUTH_PASSWORD_LOGIN_ENABLED:-true}
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_DATA_REDIRECT_URI: ${AUTH_GOOGLE_DATA_REDIRECT_URI:-}
      AUTH_GOOGLE_ALLOWED_DOMAINS: ${AUTH_GOOGLE_ALLOWED_DOMAINS:-}
      AUTH_GOOGLE_AUTO_CREATE_USERS: ${AUTH_GOOGLE_AUTO_CREATE_USERS:-false}
      AUTH_GOOGLE_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_GOOGLE_BOOTSTRAP_ADMIN_EMAIL:-}
      SEED_DEMO_DATA: "false"
      DATA_DIR: /app/.data
      DATASOURCE_ENCRYPTION_KEY: ${DATASOURCE_ENCRYPTION_KEY:-}
      GCP_SERVICE_ACCOUNT_JSON: ${GCP_SERVICE_ACCOUNT_JSON:-}
      GCP_SERVICE_ACCOUNT_EMAIL: ${GCP_SERVICE_ACCOUNT_EMAIL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - appbi-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: appbi-frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Relative path — Next.js dev server rewrites /api/v1/* → backend container.
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_AUTH_PASSWORD_LOGIN_ENABLED: ${NEXT_PUBLIC_AUTH_PASSWORD_LOGIN_ENABLED:-true}
      NEXT_PUBLIC_AUTH_GOOGLE_ENABLED: ${NEXT_PUBLIC_AUTH_GOOGLE_ENABLED:-false}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      # AI service URLs derived at runtime from window.location (no localhost baking).
      BACKEND_URL: ${FRONTEND_BACKEND_URL:-http://backend:8000/api/v1}
      SECRET_KEY: dev-secret-key
      COOKIE_SECURE: "false"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - appbi-net

volumes:
  db_data_dev:
    driver: local
  appbi_data_dev:
    driver: local

networks:
  appbi-net:
    driver: bridge
