# Rig copy of the production nginx.conf routing (HTTP only, docker DNS upstreams).
# Same locations, cookie filter, buffering and CSP as production.
events {}
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_req_zone  $binary_remote_addr zone=api_rl:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=mcp_rl:10m rate=20r/s;
    limit_req_status 429;
    map $http_cookie $mcp_cookie_txn     { "~*(?:^|;\s*)(appbi_mcp_txn=[^;]+)"     $1; default ""; }
    map $http_cookie $mcp_cookie_session { "~*(?:^|;\s*)(appbi_mcp_session=[^;]+)" $1; default ""; }

    server {
        listen 80;
        client_max_body_size 250m;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: https://accounts.google.com/gsi/; img-src 'self' data: blob: https://*.gstatic.com https://*.googleusercontent.com https://server.arcgisonline.com https://*.arcgisonline.com; font-src 'self' data:; frame-src 'self' https://accounts.google.com/gsi/; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        location /api/v1/ {
            limit_req zone=api_rl burst=60 nodelay;
            set $be http://backend:8000;
            proxy_pass $be;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location ~ ^/(mcp|mcp-oauth/.*|\.well-known/oauth-protected-resource.*|\.well-known/oauth-authorization-server.*|\.well-known/openid-configuration/mcp-oauth)$ {
            limit_req zone=mcp_rl burst=40 nodelay;
            set $mcp http://appbi-mcp:8090;
            proxy_pass $mcp;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie "$mcp_cookie_txn; $mcp_cookie_session";
            client_max_body_size 4m;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location / {
            set $fe http://frontend:3000;
            proxy_pass $fe;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}
