# AppBI local edge (docker-compose.edge.yml) on 127.0.0.1:${APPBI_HTTP_PORT:-3000}.
#
# Only the MCP routes (the same set as production nginx.conf) go to the MCP service;
# everything else is passed unchanged to the AppBI frontend, which keeps proxying
# /api/v1 to the backend exactly as before. No headers are added to app pages, and
# the browser's Host (with port) is preserved.
#
# Upstreams are resolved per request through Docker's DNS, so the edge starts and
# serves the app while the MCP is down: only the MCP routes answer 502.
events {}
http {
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # The MCP gets its own per-IP budget (same as production nginx.conf).
    limit_req_zone  $binary_remote_addr zone=mcp_rl:10m rate=20r/s;
    limit_req_status 429;
    # Only the MCP's own cookies reach the MCP service — never AppBI's session.
    map $http_cookie $mcp_cookie_txn     { "~*(?:^|;\s*)(appbi_mcp_txn=[^;]+)"     $1; default ""; }
    map $http_cookie $mcp_cookie_session { "~*(?:^|;\s*)(appbi_mcp_session=[^;]+)" $1; default ""; }

    server {
        listen 80;
        client_max_body_size 250m;

        # ── MCP integration (Claude connector): /mcp, /mcp-oauth/*, OAuth discovery ──
        location ~ ^/(mcp|mcp-oauth/.*|\.well-known/oauth-protected-resource.*|\.well-known/oauth-authorization-server.*|\.well-known/openid-configuration/mcp-oauth)$ {
            limit_req zone=mcp_rl burst=40 nodelay;
            set $mcp http://appbi-mcp:8090;
            proxy_pass $mcp;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie "$mcp_cookie_txn; $mcp_cookie_session";
            client_max_body_size 4m;
            # Streamable HTTP may answer with an SSE stream; never buffer it.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location / {
            set $fe http://frontend:3000;
            proxy_pass $fe;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }

    # Container healthcheck only; not published.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /healthz { return 200 "ok\n"; }
    }
}
